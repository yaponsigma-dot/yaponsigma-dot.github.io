        function openEarlyGuessModal(isOffline = false) {
            openModal(`
                <div class="flex items-center justify-between mb-3">
                    <div class="font-extrabold text-base">💡 Догадка шпиона (Ва-банк)</div>
                    <button onclick="window.__closeModal()" class="w-8 h-8 rounded-full btn-secondary text-sm font-bold">✕</button>
                </div>
                <p class="text-xs mb-3 leading-relaxed" style="color: var(--text-muted);">
                    Если угадаешь загаданное слово мирных — <b>победишь досрочно</b>. Если ошибёшься — сразу раскроешься и проиграешь!
                </p>
                <input id="early-guess-input" type="text" placeholder="Введи слово..." class="w-full px-4 py-3 rounded-2xl field-input text-sm font-bold mb-3">
                <button id="early-guess-submit" class="w-full py-3.5 rounded-2xl btn-primary font-extrabold text-sm">⚡ Рискнуть и назвать</button>
            `);

            document.getElementById('early-guess-submit').onclick = () => {
                const word = document.getElementById('early-guess-input').value.trim();
                if (!word) { showToast('Введи слово!', 'warn'); return; }
                closeModal();
                if (isOffline) {
                    const win = normWord(word) === normWord(passGame.card);
                    stopTimerLoop();
                    passGame.stage = 'results';
                    passGame.resultData = {
                        winner: win ? 'spy' : 'civilians',
                        headline: win ? '⚡ Шпион угадал досрочно!' : '💥 Шпион ошибся!',
                        subtext: `Шпион пошёл ва-банк и назвал «${word}» — ${win ? 'ТОЧНО В ЦЕЛЬ!' : 'НЕВЕРНО! Мирные победили!'}`,
                        spyNames: passGame.spyIndices.map(i => passGame.players[i])
                    };
                    win ? sfxAlert() : sfxSuccess();
                    render();
                } else {
                    sendToHost({ type: 'spy_guess', uid: currentUser.id, word });
                }
            };
        }

        // =========================================================================
        // 11. ПРИВЯЗКА СОБЫТИЙ ТЕКУЩЕГО ЭКРАНА
        // =========================================================================
        function bindCurrentViewEvents() {
            // Главная
            if (activeView === 'home') {
                const btnCreate = document.getElementById('btn-create-online');
                const btnJoin = document.getElementById('btn-join-online');
                const codeInput = document.getElementById('input-room-code');
                const btnPass = document.getElementById('btn-open-passplay');

                if (btnCreate) btnCreate.onclick = () => { sfxClick(); createOnlineRoom(); };
                if (btnJoin) btnJoin.onclick = () => { sfxClick(); joinOnlineRoom(codeInput.value); };
                if (codeInput) codeInput.onkeydown = (e) => { if (e.key === 'Enter') joinOnlineRoom(codeInput.value); };
                if (btnPass) btnPass.onclick = () => { sfxClick(); openPassPlaySetup(); };

                document.querySelectorAll('[data-rejoin]').forEach(btn => {
                    btn.onclick = () => { sfxClick(); joinOnlineRoom(btn.dataset.rejoin); };
                });
            }

            // Онлайн комната
            if (activeView === 'online_room') {
                const copyBtn = document.getElementById('btn-copy-code');
                if (copyBtn) copyBtn.onclick = () => {
                    if (copyText(clientView.code)) showToast(`Код ${clientView.code} скопирован!`, 'success');
                    haptic('light');
                };

                const shareBtn = document.getElementById('btn-share-link');
                if (shareBtn) shareBtn.onclick = () => {
                    const cleanBot = (appSettings.botUsername || '').replace(/^@/, '').trim();
                    const link = cleanBot
                        ? `https://t.me/${cleanBot}?startapp=${clientView.code}`
                        : `${window.location.origin}${window.location.pathname}?room=${clientView.code}`;
                    copyText(link);
                    showToast('Ссылка-приглашение скопирована!', 'success');
                    haptic('light');
                };

                const cfgBtn = document.getElementById('btn-room-settings');
                if (cfgBtn) cfgBtn.onclick = () => { sfxClick(); openRoomSettingsModal(); };

                const startBtn = document.getElementById('btn-start-online');
                if (startBtn) startBtn.onclick = () => startOnlineRound();

                const leaveBtn = document.getElementById('btn-leave-online');
                if (leaveBtn) leaveBtn.onclick = () => { sfxClick(); leaveOnlineRoom(); };

                const backLobbyBtn = document.getElementById('btn-back-lobby');
                if (backLobbyBtn) backLobbyBtn.onclick = () => { sfxClick(); returnOnlineToLobby(); };

                // Карточка роли (тап или удержание)
                const roleCard = document.getElementById('role-card-toggle');
                const toggleBtn = document.getElementById('btn-toggle-role-explicit');
                if (roleCard) {
                    if (appSettings.holdToReveal) {
                        roleCard.onpointerdown = () => { roleHidden = false; render(); };
                        roleCard.onpointerup = () => { roleHidden = true; render(); };
                        roleCard.onpointerleave = () => { if (!roleHidden) { roleHidden = true; render(); } };
                    } else {
                        roleCard.onclick = () => { roleHidden = !roleHidden; sfxClick(); haptic('light'); render(); };
                    }
                }
                if (toggleBtn) toggleBtn.onclick = () => { roleHidden = !roleHidden; sfxClick(); haptic('light'); render(); };

                const openVoteBtn = document.getElementById('btn-open-vote');
                if (openVoteBtn) openVoteBtn.onclick = () => { showVotePanel = !showVotePanel; sfxClick(); render(); };

                const closeVoteBtn = document.getElementById('btn-close-vote');
                if (closeVoteBtn) closeVoteBtn.onclick = () => { showVotePanel = false; sfxClick(); render(); };

                document.querySelectorAll('[data-vote-id]').forEach(b => {
                    b.onclick = () => {
                        sfxClick();
                        haptic('medium');
                        sendToHost({ type: 'vote', uid: currentUser.id, targetId: b.dataset.voteId });
                        showToast('Голос принят!', 'success');
                    };
                });

                const earlyBtn = document.getElementById('btn-spy-early-guess');
                if (earlyBtn) earlyBtn.onclick = () => { sfxClick(); openEarlyGuessModal(false); };

                const finishBtn = document.getElementById('btn-host-finish');
                if (finishBtn) finishBtn.onclick = () => { sfxClick(); finishOnlineVoting(false); };

                const lcSubmit = document.getElementById('btn-submit-last-chance');
                if (lcSubmit) lcSubmit.onclick = () => {
                    const w = document.getElementById('input-last-chance').value.trim();
                    if (!w) { showToast('Напиши слово!', 'warn'); return; }
                    sendToHost({ type: 'spy_guess', uid: currentUser.id, word: w });
                };

                const lcSkip = document.getElementById('btn-skip-last-chance');
                if (lcSkip) lcSkip.onclick = () => { sfxClick(); finishOnlineVoting(true); };
            }

            // Pass & Play
            if (activeView === 'pass_play') {
                const exitBtn = document.getElementById('pp-exit');
                if (exitBtn) exitBtn.onclick = () => { stopTimerLoop(); passGame.active = false; activeView = 'home'; render(); };

                const packSel = document.getElementById('pp-pack');
                if (packSel) packSel.onchange = () => { passGame.packId = packSel.value; };

                const mClassic = document.getElementById('pp-mode-classic');
                const mUnder = document.getElementById('pp-mode-under');
                if (mClassic) mClassic.onclick = () => { passGame.mode = 'classic'; sfxClick(); render(); };
                if (mUnder) mUnder.onclick = () => { passGame.mode = 'undercover'; sfxClick(); render(); };

                document.querySelectorAll('[data-pp-spy]').forEach(b => b.onclick = () => { passGame.spyCount = Number(b.dataset.ppSpy); sfxClick(); render(); });
                document.querySelectorAll('[data-pp-timer]').forEach(b => b.onclick = () => { passGame.timerMin = Number(b.dataset.ppTimer); sfxClick(); render(); });

                document.querySelectorAll('[data-pp-name]').forEach(inp => {
                    inp.oninput = () => { passGame.players[Number(inp.dataset.ppName)] = inp.value; };
                });
                document.querySelectorAll('[data-pp-del]').forEach(btn => {
                    btn.onclick = () => { passGame.players.splice(Number(btn.dataset.ppDel), 1); sfxClick(); render(); };
                });

                const addP = document.getElementById('pp-add-player');
                if (addP) addP.onclick = () => {
                    if (passGame.players.length >= 12) { showToast('Максимум 12 игроков', 'warn'); return; }
                    passGame.players.push(`Игрок ${passGame.players.length + 1}`);
                    sfxClick();
                    render();
                };

                const startPP = document.getElementById('pp-start');
                if (startPP) startPP.onclick = () => startPassPlayRound();

                const revBtn = document.getElementById('pp-reveal-btn');
                if (revBtn) revBtn.onclick = () => { passGame.cardRevealed = true; sfxReveal(); haptic('medium'); render(); };

                const nextP = document.getElementById('pp-next-player');
                if (nextP) nextP.onclick = () => {
                    sfxClick();
                    if (passGame.currentIdx + 1 < passGame.players.length) {
                        passGame.currentIdx++;
                        passGame.cardRevealed = false;
                    } else {
                        passGame.stage = 'discuss';
                        if (passGame.timerMin > 0) {
                            passGame.timerRunning = true;
                            ensureTimerLoop();
                        }
                    }
                    render();
                };

                const tToggle = document.getElementById('pp-timer-toggle');
                if (tToggle) tToggle.onclick = () => {
                    passGame.timerRunning = !passGame.timerRunning;
                    passGame.timerRunning ? ensureTimerLoop() : stopTimerLoop();
                    sfxClick();
                    render();
                };

                const tPlus = document.getElementById('pp-timer-plus');
                if (tPlus) tPlus.onclick = () => { passGame.timerSecLeft += 60; sfxClick(); render(); };

                const goVote = document.getElementById('pp-go-vote');
                if (goVote) goVote.onclick = () => { stopTimerLoop(); passGame.timerRunning = false; passGame.stage = 'vote'; sfxClick(); render(); };

                const ppEarly = document.getElementById('pp-early-guess');
                if (ppEarly) ppEarly.onclick = () => { sfxClick(); openEarlyGuessModal(true); };

                const ppAbort = document.getElementById('pp-abort');
                if (ppAbort) ppAbort.onclick = () => {
                    stopTimerLoop();
                    passGame.stage = 'results';
                    passGame.resultData = {
                        winner: 'spy',
                        headline: '🏁 Раунд завершён',
                        subtext: 'Роли раскрыты досрочно.',
                        spyNames: passGame.spyIndices.map(i => passGame.players[i])
                    };
                    render();
                };

                const backDisc = document.getElementById('pp-back-discuss');
                if (backDisc) backDisc.onclick = () => { passGame.stage = 'discuss'; sfxClick(); render(); };

                document.querySelectorAll('[data-pp-kick]').forEach(btn => {
                    btn.onclick = () => {
                        const idx = Number(btn.dataset.ppKick);
                        passGame.votedOutIdx = idx;
                        if (passGame.spyIndices.includes(idx)) {
                            passGame.stage = 'last_chance';
                            sfxAlert();
                            haptic('warning');
                        } else {
                            passGame.stage = 'results';
                            passGame.resultData = {
                                winner: 'spy',
                                headline: '🕵️‍♂️ Шпион победил!',
                                subtext: `Вы выгнали мирного игрока (${passGame.players[idx]})!`,
                                spyNames: passGame.spyIndices.map(i => passGame.players[i])
                            };
                            sfxAlert();
                        }
                        render();
                    };
                });

                const lcSub = document.getElementById('pp-lc-submit');
                if (lcSub) lcSub.onclick = () => {
                    const word = document.getElementById('pp-lc-input').value.trim();
                    if (!word) { showToast('Введи слово!', 'warn'); return; }
                    const win = normWord(word) === normWord(passGame.card);
                    passGame.stage = 'results';
                    passGame.resultData = {
                        winner: win ? 'spy' : 'civilians',
                        headline: win ? '😱 Шпион украл победу!' : '🎉 Мирные победили!',
                        subtext: `Шпион назвал «${word}» — ${win ? 'И УГАДАЛ!' : 'НЕВЕРНО!'}`,
                        spyNames: passGame.spyIndices.map(i => passGame.players[i])
                    };
                    win ? sfxAlert() : sfxSuccess();
                    render();
                };

                const lcSkip = document.getElementById('pp-lc-skip');
                if (lcSkip) lcSkip.onclick = () => {
                    passGame.stage = 'results';
                    passGame.resultData = {
                        winner: 'civilians',
                        headline: '🎉 Мирные победили!',
                        subtext: 'Шпион сдался и не смог назвать слово.',
                        spyNames: passGame.spyIndices.map(i => passGame.players[i])
                    };
                    sfxSuccess();
                    render();
                };

                const ppReplay = document.getElementById('pp-replay');
                if (ppReplay) ppReplay.onclick = () => startPassPlayRound();

                const ppToSetup = document.getElementById('pp-to-setup');
                if (ppToSetup) ppToSetup.onclick = () => { passGame.stage = 'setup'; sfxClick(); render(); };
            }

            // Наборы слов
            if (activeView === 'packs') {
                document.getElementById('btn-new-pack').onclick = () => { sfxClick(); openPackEditorModal(); };
                document.querySelectorAll('[data-edit-pack]').forEach(b => {
                    b.onclick = () => { sfxClick(); openPackEditorModal(b.dataset.editPack); };
                });
                document.querySelectorAll('[data-del-pack]').forEach(b => {
                    b.onclick = () => {
                        const id = b.dataset.delPack;
                        delete customPacks[id];
                        saveJson(STORAGE_KEYS.CUSTOM_PACKS, customPacks);
                        sfxClick();
                        showToast('Набор удалён', 'info');
                        render();
                    };
                });
            }

            // Настройки приложения
            if (activeView === 'settings') {
                document.getElementById('btn-save-name').onclick = () => {
                    const v = document.getElementById('set-player-name').value.trim();
                    if (!v) return;
                    currentUser.name = v.slice(0, 24);
                    saveJson('spy_guest_user', currentUser);
                    sfxSuccess();
                    showToast('Имя обновлено!', 'success');
                    render();
                };

                document.querySelectorAll('[data-set-theme]').forEach(b => {
                    b.onclick = () => {
                        appSettings.theme = b.dataset.setTheme;
                        saveJson(STORAGE_KEYS.SETTINGS, appSettings);
                        applyTheme();
                        sfxClick();
                        render();
                    };
                });

                document.querySelectorAll('[data-toggle]').forEach(b => {
                    b.onclick = () => {
                        const key = b.dataset.toggle;
                        appSettings[key] = !appSettings[key];
                        saveJson(STORAGE_KEYS.SETTINGS, appSettings);
                        sfxClick();
                        haptic('light');
                        render();
                    };
                });

                document.getElementById('btn-save-bot').onclick = () => {
                    appSettings.botUsername = document.getElementById('set-bot-user').value.trim().replace(/^@/, '');
                    saveJson(STORAGE_KEYS.SETTINGS, appSettings);
                    sfxSuccess();
                    showToast('Username бота сохранён!', 'success');
                };

                document.getElementById('btn-show-rules').onclick = () => {
                    sfxClick();
                    openModal(`
                        <div class="flex items-center justify-between mb-3">
                            <div class="font-extrabold text-base">📖 Как играть</div>
                            <button onclick="window.__closeModal()" class="w-8 h-8 rounded-full btn-secondary text-sm font-bold">✕</button>
                        </div>
                        <div class="space-y-3 text-xs leading-relaxed" style="color: var(--text-muted);">
                            <p><b class="text-white">🕵️‍♂️ Обычный режим:</b> Все мирные получают одну и ту же карту/слово, а шпион не знает слово. Задавайте наводящие вопросы, чтобы вычислить шпиона, но не спалите слово!</p>
                            <p><b class="text-white">🎭 Под прикрытием:</b> Мирные получают одну карту (например, <i>Ледяной голем</i>), а шпион получает очень похожую (<i>Голем</i>). Шпион сам не знает, что он шпион!</p>
                            <p><b class="text-white">🔥 Последний шанс:</b> Если шпиона раскрыли на голосовании, у него есть последняя попытка назвать слово мирных. Угадает — победа его!</p>
                        </div>
                    `);
                };
            }
        }

        // Навигация снизу
        document.querySelectorAll('.nav-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                currentTab = btn.dataset.nav;
                activeView = currentTab;
                sfxClick();
                haptic('light');
                render();
            });
        });

        window.__closeModal = closeModal;

        // Автоматический вход по ссылке (?room=1234 или Telegram ?startapp=1234)
        function checkDeepLink() {
            const urlParams = new URLSearchParams(window.location.search);
            let autoCode = urlParams.get('room');
            if (!autoCode && tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param) {
                autoCode = tg.initDataUnsafe.start_param;
            }
            if (autoCode && /^\d{4}$/.test(autoCode)) {
                setTimeout(() => joinOnlineRoom(autoCode), 450);
            }
        }

        applyTheme();
        render();
        checkDeepLink();
    })();
    </script>
</body>
</html>
