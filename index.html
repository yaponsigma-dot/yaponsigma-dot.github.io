                    <button id="rcfg-save" class="w-full py-3.5 rounded-2xl btn-primary font-extrabold text-sm">✅ Сохранить настройки</button>
                </div>
            `);

            document.getElementById('rcfg-m-classic').onclick = () => { hostRoom.mode = 'classic'; sfxClick(); openRoomSettingsModal(); };
            document.getElementById('rcfg-m-under').onclick = () => { hostRoom.mode = 'undercover'; sfxClick(); openRoomSettingsModal(); };
            document.getElementById('rcfg-public').onclick = () => { hostRoom.isPublic = !hostRoom.isPublic; sfxClick(); openRoomSettingsModal(); };
            document.querySelectorAll('[data-rcfg-mp]').forEach(b => b.onclick = () => { hostRoom.maxPlayers = Number(b.dataset.rcfgMp); sfxClick(); openRoomSettingsModal(); });
            document.querySelectorAll('[data-rcfg-spy]').forEach(b => b.onclick = () => { hostRoom.spyCount = Number(b.dataset.rcfgSpy); sfxClick(); openRoomSettingsModal(); });
            document.querySelectorAll('[data-rcfg-tm]').forEach(b => b.onclick = () => { hostRoom.timerMin = Number(b.dataset.rcfgTm); sfxClick(); openRoomSettingsModal(); });

            document.getElementById('rcfg-save').onclick = () => {
                const newTitle = document.getElementById('rcfg-title').value.trim();
                if (newTitle) hostRoom.title = newTitle.slice(0, 32);
                hostRoom.tag = document.getElementById('rcfg-tag').value.trim().slice(0, 24);
                hostRoom.packId = document.getElementById('rcfg-pack').value;
                // Сохраняем настройки комнаты для будущих созданий
                roomDefaults = {
                    title: newTitle && !/^Комната #\d{4}$/.test(newTitle) ? hostRoom.title : '',
                    tag: hostRoom.tag,
                    isPublic: hostRoom.isPublic,
                    maxPlayers: hostRoom.maxPlayers,
                    mode: hostRoom.mode,
                    packId: hostRoom.packId,
                    spyCount: hostRoom.spyCount,
                    timerMin: hostRoom.timerMin
                };
                persistRoomDefaults();
                rememberRoom(hostRoom.code, hostRoom.title);
                sfxSuccess();
                closeModal();
                syncHostToAll();
                showToast('Настройки комнаты сохранены!', 'success');
            };
        }

        function openPackEditorModal(editId = null) {
            const existing = editId ? customPacks[editId] : null;
            openModal(`
                <div class="flex items-center justify-between mb-3">
                    <div class="font-extrabold text-base">${existing ? '✏️ Редактировать набор' : '➕ Новый набор слов'}</div>
                    <button onclick="window.__closeModal()" class="w-8 h-8 rounded-full btn-secondary text-sm font-bold">✕</button>
                </div>
                <div class="space-y-3 text-sm">
                    <div>
                        <label class="block text-xs font-bold mb-1" style="color: var(--text-muted);">Название набора</label>
                        <input id="pk-title" type="text" value="${escHtml(existing ? existing.title.replace(/^✨\s*/, '') : '')}" placeholder="Например: 8-В Класс" class="w-full px-3.5 py-2.5 rounded-xl field-input text-sm font-bold">
                    </div>
                    <div>
                        <label class="block text-xs font-bold mb-1" style="color: var(--text-muted);">Список имён/слов (через запятую или с новой строки)</label>
                        <textarea id="pk-items" rows="6" placeholder="Амир, Богдан, Виктория, Денис, Эрнест..." class="w-full px-3.5 py-2.5 rounded-xl field-input text-sm">${escHtml(existing ? existing.items.join(', ') : '')}</textarea>
                    </div>
                    <button id="pk-save-btn" class="w-full py-3.5 rounded-2xl btn-primary font-extrabold text-sm">💾 Сохранить набор</button>
                </div>
            `);

            document.getElementById('pk-save-btn').onclick = () => {
                const title = document.getElementById('pk-title').value.trim();
                const raw = document.getElementById('pk-items').value;
                const items = raw.replace(/\n/g, ',').split(',').map(s => s.trim()).filter(Boolean);

                if (!title) { showToast('Введи название набора!', 'warn'); return; }
                if (items.length < 2) { showToast('Нужно минимум 2 слова или имени!', 'warn'); return; }

                const id = editId || ('c_' + Date.now());
                customPacks[id] = {
                    id,
                    title: title.startsWith('✨') ? title : `✨ ${title}`,
                    itemLabel: 'Загадано',
                    items,
                    pairs: [],
                    builtin: false
                };
                saveJson(STORAGE_KEYS.CUSTOM_PACKS, customPacks);
                sfxSuccess();
                closeModal();
                showToast(`Набор «${title}» (${items.length} шт.) сохранён!`, 'success');
                render();
            };
        }

        function openEarlyGuessModal(isOffline = false) {
            openModal(`
                <div class="flex items-center justify-between mb-3">
                    <div class="font-extrabold text-base">💡 Догадка шпиона (Ва-банк)</div>
                    <button onclick="window.__closeModal()" class="w-8 h-8 rounded-full btn-secondary text-sm font-bold">✕</button>
                </div>
                <p class="text-xs mb-3 leading-relaxed" style="color: var(--text-muted);">
                    Если угадаешь загаданное слово мирных — <b>победишь досрочно</b>. Если ошибёшься — сразу раскроешься и проиграешь!
                </p>
                <input id="early-guess-input" type="text" placeholder="Введи слово..." class="w-full px-4 py-3 rounded-2xl field-input text-sm font-bold mb-3">
                <button id="early-guess-submit" class="w-full py-3.5 rounded-2xl btn-primary font-extrabold text-sm">⚡ Рискнуть и назвать</button>
            `);

            document.getElementById('early-guess-submit').onclick = () => {
                const word = document.getElementById('early-guess-input').value.trim();
                if (!word) { showToast('Введи слово!', 'warn'); return; }
                closeModal();
                if (isOffline) {
                    const win = normWord(word) === normWord(passGame.card);
                    stopTimerLoop();
                    passGame.stage = 'results';
                    passGame.resultData = {
                        winner: win ? 'spy' : 'civilians',
                        headline: win ? '⚡ Шпион угадал досрочно!' : '💥 Шпион ошибся!',
                        subtext: `Шпион пошёл ва-банк и назвал «${word}» — ${win ? 'ТОЧНО В ЦЕЛЬ!' : 'НЕВЕРНО! Мирные победили!'}`,
                        spyNames: passGame.spyIndices.map(i => passGame.players[i])
                    };
                    win ? sfxAlert() : sfxSuccess();
                    render();
                } else {
                    sendToHost({ type: 'spy_guess', uid: currentUser.id, word });
                }
            };
        }

        // =========================================================================
        // 11. ПРИВЯЗКА СОБЫТИЙ ТЕКУЩЕГО ЭКРАНА
        // =========================================================================
        function bindCurrentViewEvents() {
            if (activeView === 'home') {
                const btnCreate = document.getElementById('btn-create-online');
                const btnJoin = document.getElementById('btn-join-online');
                const codeInput = document.getElementById('input-room-code');
                const btnPass = document.getElementById('btn-open-passplay');
                const btnRef = document.getElementById('btn-refresh-lobby');

                if (btnCreate) btnCreate.onclick = () => { sfxClick(); createOnlineRoom(); };
                if (btnJoin) btnJoin.onclick = () => { sfxClick(); joinOnlineRoom(codeInput.value); };
                if (codeInput) codeInput.onkeydown = (e) => { if (e.key === 'Enter') joinOnlineRoom(codeInput.value); };
                if (btnPass) btnPass.onclick = () => { sfxClick(); openPassPlaySetup(); };
                if (btnRef) btnRef.onclick = () => {
                    sfxClick();
                    if (!lobbyDir.client) initOpenRoomsDirectory();
                    render();
                    showToast('Список открытых комнат обновлён', 'info');
                };

                document.querySelectorAll('[data-rejoin]').forEach(btn => {
                    btn.onclick = () => { sfxClick(); joinOnlineRoom(btn.dataset.rejoin); };
                });
            }

            if (activeView === 'online_room') {
                const copyBtn = document.getElementById('btn-copy-code');
                if (copyBtn) copyBtn.onclick = () => {
                    if (copyText(clientView.code)) showToast(`Код ${clientView.code} скопирован!`, 'success');
                    haptic('light');
                };

                const shareBtn = document.getElementById('btn-share-link');
                if (shareBtn) shareBtn.onclick = () => {
                    const cleanBot = (appSettings.botUsername || '').replace(/^@/, '').trim();
                    const link = cleanBot
                        ? `https://t.me/${cleanBot}?startapp=${clientView.code}`
                        : `${window.location.origin}${window.location.pathname}?room=${clientView.code}`;
                    copyText(link);
                    showToast('Ссылка-приглашение скопирована!', 'success');
                    haptic('light');
                };

                const cfgBtn = document.getElementById('btn-room-settings');
                if (cfgBtn) cfgBtn.onclick = () => { sfxClick(); openRoomSettingsModal(); };

                const startBtn = document.getElementById('btn-start-online');
                if (startBtn) startBtn.onclick = () => startOnlineRound();

                const leaveBtn = document.getElementById('btn-leave-online');
                if (leaveBtn) leaveBtn.onclick = () => { sfxClick(); leaveOnlineRoom(); };

                const backLobbyBtn = document.getElementById('btn-back-lobby');
                if (backLobbyBtn) backLobbyBtn.onclick = () => { sfxClick(); returnOnlineToLobby(); };

                const roleCard = document.getElementById('role-card-toggle');
                const toggleBtn = document.getElementById('btn-toggle-role-explicit');
                if (roleCard) {
                    if (appSettings.holdToReveal) {
                        roleCard.onpointerdown = () => { roleHidden = false; render(); };
                        roleCard.onpointerup = () => { roleHidden = true; render(); };
                        roleCard.onpointerleave = () => { if (!roleHidden) { roleHidden = true; render(); } };
                    } else {
                        roleCard.onclick = () => { roleHidden = !roleHidden; sfxClick(); haptic('light'); render(); };
                    }
                }
                if (toggleBtn) toggleBtn.onclick = () => { roleHidden = !roleHidden; sfxClick(); haptic('light'); render(); };

                const openVoteBtn = document.getElementById('btn-open-vote');
                if (openVoteBtn) openVoteBtn.onclick = () => { showVotePanel = !showVotePanel; sfxClick(); render(); };

                const closeVoteBtn = document.getElementById('btn-close-vote');
                if (closeVoteBtn) closeVoteBtn.onclick = () => { showVotePanel = false; sfxClick(); render(); };

                document.querySelectorAll('[data-vote-id]').forEach(b => {
                    b.onclick = () => {
                        sfxClick();
                        haptic('medium');
                        sendToHost({ type: 'vote', uid: currentUser.id, targetId: b.dataset.voteId });
                        showToast('Голос принят!', 'success');
                    };
                });

                const earlyBtn = document.getElementById('btn-spy-early-guess');
                if (earlyBtn) earlyBtn.onclick = () => { sfxClick(); openEarlyGuessModal(false); };

                const finishBtn = document.getElementById('btn-host-finish');
                if (finishBtn) finishBtn.onclick = () => { sfxClick(); finishOnlineVoting(false); };

                const lcSubmit = document.getElementById('btn-submit-last-chance');
                if (lcSubmit) lcSubmit.onclick = () => {
                    const w = document.getElementById('input-last-chance').value.trim();
                    if (!w) { showToast('Напиши слово!', 'warn'); return; }
                    sendToHost({ type: 'spy_guess', uid: currentUser.id, word: w });
                };

                const lcSkip = document.getElementById('btn-skip-last-chance');
                if (lcSkip) lcSkip.onclick = () => { sfxClick(); finishOnlineVoting(true); };
            }

            if (activeView === 'pass_play') {
                const exitBtn = document.getElementById('pp-exit');
                if (exitBtn) exitBtn.onclick = () => { stopTimerLoop(); passGame.active = false; activeView = 'home'; render(); };

                const packSel = document.getElementById('pp-pack');
                if (packSel) packSel.onchange = () => {
                    passGame.packId = packSel.value;
                    passDefaults.packId = passGame.packId;
                    persistPassDefaults();
                };

                const mClassic = document.getElementById('pp-mode-classic');
                const mUnder = document.getElementById('pp-mode-under');
                if (mClassic) mClassic.onclick = () => { passGame.mode = 'classic'; passDefaults.mode = 'classic'; persistPassDefaults(); sfxClick(); render(); };
                if (mUnder) mUnder.onclick = () => { passGame.mode = 'undercover'; passDefaults.mode = 'undercover'; persistPassDefaults(); sfxClick(); render(); };

                document.querySelectorAll('[data-pp-spy]').forEach(b => b.onclick = () => { passGame.spyCount = Number(b.dataset.ppSpy); passDefaults.spyCount = passGame.spyCount; persistPassDefaults(); sfxClick(); render(); });
                document.querySelectorAll('[data-pp-timer]').forEach(b => b.onclick = () => { passGame.timerMin = Number(b.dataset.ppTimer); passDefaults.timerMin = passGame.timerMin; persistPassDefaults(); sfxClick(); render(); });

                document.querySelectorAll('[data-pp-name]').forEach(inp => {
                    inp.oninput = () => { passGame.players[Number(inp.dataset.ppName)] = inp.value; persistPassDefaults(); };
                });
                document.querySelectorAll('[data-pp-del]').forEach(btn => {
                    btn.onclick = () => { passGame.players.splice(Number(btn.dataset.ppDel), 1); persistPassDefaults(); sfxClick(); render(); };
                });

                const addP = document.getElementById('pp-add-player');
                if (addP) addP.onclick = () => {
                    if (passGame.players.length >= 12) { showToast('Максимум 12 игроков', 'warn'); return; }
                    passGame.players.push(`Игрок ${passGame.players.length + 1}`);
                    persistPassDefaults();
                    sfxClick();
                    render();
                };

                const startPP = document.getElementById('pp-start');
                if (startPP) startPP.onclick = () => startPassPlayRound();

                const revBtn = document.getElementById('pp-reveal-btn');
                if (revBtn) revBtn.onclick = () => { passGame.cardRevealed = true; sfxReveal(); haptic('medium'); render(); };

                const nextP = document.getElementById('pp-next-player');
                if (nextP) nextP.onclick = () => {
                    sfxClick();
                    if (passGame.currentIdx + 1 < passGame.players.length) {
                        passGame.currentIdx++;
                        passGame.cardRevealed = false;
                    } else {
                        passGame.stage = 'discuss';
                        if (passGame.timerMin > 0) {
                            passGame.timerRunning = true;
                            ensureTimerLoop();
                        }
                    }
                    render();
                };

                const tToggle = document.getElementById('pp-timer-toggle');
                if (tToggle) tToggle.onclick = () => {
                    passGame.timerRunning = !passGame.timerRunning;
                    passGame.timerRunning ? ensureTimerLoop() : stopTimerLoop();
                    sfxClick();
                    render();
                };

                const tPlus = document.getElementById('pp-timer-plus');
                if (tPlus) tPlus.onclick = () => { passGame.timerSecLeft += 60; sfxClick(); render(); };

                const goVote = document.getElementById('pp-go-vote');
                if (goVote) goVote.onclick = () => { stopTimerLoop(); passGame.timerRunning = false; passGame.stage = 'vote'; sfxClick(); render(); };

                const ppEarly = document.getElementById('pp-early-guess');
                if (ppEarly) ppEarly.onclick = () => { sfxClick(); openEarlyGuessModal(true); };

                const ppAbort = document.getElementById('pp-abort');
                if (ppAbort) ppAbort.onclick = () => {
                    stopTimerLoop();
                    passGame.stage = 'results';
                    passGame.resultData = {
                        winner: 'spy',
                        headline: '🏁 Раунд завершён',
                        subtext: 'Роли раскрыты досрочно.',
                        spyNames: passGame.spyIndices.map(i => passGame.players[i])
                    };
                    render();
                };

                const backDisc = document.getElementById('pp-back-discuss');
                if (backDisc) backDisc.onclick = () => { passGame.stage = 'discuss'; sfxClick(); render(); };

                document.querySelectorAll('[data-pp-kick]').forEach(btn => {
                    btn.onclick = () => {
                        const idx = Number(btn.dataset.ppKick);
                        passGame.votedOutIdx = idx;
                        if (passGame.spyIndices.includes(idx)) {
                            passGame.stage = 'last_chance';
                            sfxAlert();
                            haptic('warning');
                        } else {
                            passGame.stage = 'results';
                            passGame.resultData = {
                                winner: 'spy',
                                headline: '🕵️‍♂️ Шпион победил!',
                                subtext: `Вы выгнали мирного игрока (${passGame.players[idx]})!`,
                                spyNames: passGame.spyIndices.map(i => passGame.players[i])
                            };
                            sfxAlert();
                        }
                        render();
                    };
                });

                const lcSub = document.getElementById('pp-lc-submit');
                if (lcSub) lcSub.onclick = () => {
                    const word = document.getElementById('pp-lc-input').value.trim();
                    if (!word) { showToast('Введи слово!', 'warn'); return; }
                    const win = normWord(word) === normWord(passGame.card);
                    passGame.stage = 'results';
                    passGame.resultData = {
                        winner: win ? 'spy' : 'civilians',
                        headline: win ? '😱 Шпион украл победу!' : '🎉 Мирные победили!',
                        subtext: `Шпион назвал «${word}» — ${win ? 'И УГАДАЛ!' : 'НЕВЕРНО!'}`,
                        spyNames: passGame.spyIndices.map(i => passGame.players[i])
                    };
                    win ? sfxAlert() : sfxSuccess();
                    render();
                };

                const lcSkip = document.getElementById('pp-lc-skip');
                if (lcSkip) lcSkip.onclick = () => {
                    passGame.stage = 'results';
                    passGame.resultData = {
                        winner: 'civilians',
                        headline: '🎉 Мирные победили!',
                        subtext: 'Шпион сдался и не смог назвать слово.',
                        spyNames: passGame.spyIndices.map(i => passGame.players[i])
                    };
                    sfxSuccess();
                    render();
                };

                const ppReplay = document.getElementById('pp-replay');
                if (ppReplay) ppReplay.onclick = () => startPassPlayRound();

                const ppToSetup = document.getElementById('pp-to-setup');
                if (ppToSetup) ppToSetup.onclick = () => { passGame.stage = 'setup'; sfxClick(); render(); };
            }

            if (activeView === 'packs') {
                const btnNew = document.getElementById('btn-new-pack');
                if (btnNew) btnNew.onclick = () => { sfxClick(); openPackEditorModal(); };
                document.querySelectorAll('[data-edit-pack]').forEach(b => {
                    b.onclick = () => { sfxClick(); openPackEditorModal(b.dataset.editPack); };
                });
                document.querySelectorAll('[data-del-pack]').forEach(b => {
                    b.onclick = () => {
                        const id = b.dataset.delPack;
                        delete customPacks[id];
                        saveJson(STORAGE_KEYS.CUSTOM_PACKS, customPacks);
                        sfxClick();
                        showToast('Набор удалён', 'info');
                        render();
                    };
                });
            }

            if (activeView === 'settings') {
                const nameInput = document.getElementById('set-player-name');
                const saveNameAction = () => {
                    if (!nameInput) return;
                    const v = nameInput.value.trim();
                    if (!v) return;
                    currentUser.name = v.slice(0, 24);
                    currentUser.customName = currentUser.name;
                    persistUserProfile();
                    sfxSuccess();
                    showToast('Имя сохранено!', 'success');
                    render();
                };
                const saveNameBtn = document.getElementById('btn-save-name');
                if (saveNameBtn) saveNameBtn.onclick = saveNameAction;
                if (nameInput) nameInput.onkeydown = (e) => { if (e.key === 'Enter') saveNameAction(); };

                document.querySelectorAll('[data-set-avatar]').forEach(b => {
                    b.onclick = () => {
                        currentUser.avatar = b.dataset.setAvatar;
                        persistUserProfile();
                        sfxClick();
                        haptic('light');
                        render();
                    };
                });

                document.querySelectorAll('[data-set-font]').forEach(b => {
                    b.onclick = () => {
                        appSettings.font = b.dataset.setFont;
                        persistSettings();
                        applyTheme();
                        sfxClick();
                        haptic('light');
                        render();
                    };
                });

                document.querySelectorAll('[data-set-theme]').forEach(b => {
                    b.onclick = () => {
                        appSettings.theme = b.dataset.setTheme;
                        if (appSettings.theme !== 'custom') appSettings.customAccent = '';
                        persistSettings();
                        applyTheme();
                        sfxClick();
                        render();
                    };
                });

                // Конструктор своей темы
                document.querySelectorAll('[data-ct-key]').forEach(inp => {
                    const key = inp.dataset.ctKey;
                    inp.oninput = () => {
                        appSettings.customTheme[key] = inp.value;
                        persistSettings();
                        applyTheme();
                    };
                    inp.onchange = () => {
                        appSettings.customTheme[key] = inp.value;
                        persistSettings();
                        applyTheme();
                        render();
                    };
                });

                const ctAlphaSlider = document.getElementById('ct-alpha-slider');
                const ctAlphaVal = document.getElementById('ct-alpha-val');
                if (ctAlphaSlider) {
                    ctAlphaSlider.oninput = () => {
                        appSettings.customTheme.cardAlpha = Number(ctAlphaSlider.value);
                        if (ctAlphaVal) ctAlphaVal.textContent = `${appSettings.customTheme.cardAlpha}%`;
                        persistSettings();
                        applyTheme();
                    };
                    ctAlphaSlider.onchange = () => persistSettings();
                }

                const ctRandBtn = document.getElementById('btn-ct-random');
                if (ctRandBtn) ctRandBtn.onclick = () => {
                    const randHex = (min, max) => '#' + [0,1,2].map(() => Math.floor(min + Math.random() * (max - min)).toString(16).padStart(2, '0')).join('');
                    const darkBg = Math.random() > 0.25;
                    appSettings.customTheme = {
                        bgMain: darkBg ? randHex(8, 32) : randHex(232, 250),
                        bgCard: darkBg ? randHex(20, 52) : '#ffffff',
                        textMain: darkBg ? '#f8fafc' : '#0f172a',
                        textMuted: darkBg ? '#94a3b8' : '#475569',
                        accent: randHex(80, 245),
                        accent2: randHex(80, 245),
                        border: randHex(90, 220),
                        cardAlpha: 78
                    };
                    persistSettings();
                    applyTheme();
                    sfxClick();
                    render();
                };

                const ctResetBtn = document.getElementById('btn-ct-reset');
                if (ctResetBtn) ctResetBtn.onclick = () => {
                    appSettings.customTheme = Object.assign({}, DEFAULT_CUSTOM_THEME);
                    persistSettings();
                    applyTheme();
                    sfxClick();
                    render();
                };

                document.querySelectorAll('[data-set-accent]').forEach(b => {
                    b.onclick = () => {
                        appSettings.customAccent = b.dataset.setAccent;
                        persistSettings();
                        applyTheme();
                        sfxClick();
                        render();
                    };
                });

                const colorInp = document.getElementById('set-custom-color');
                if (colorInp) {
                    colorInp.oninput = () => {
                        appSettings.customAccent = colorInp.value;
                        persistSettings();
                        applyTheme();
                    };
                    colorInp.onchange = () => {
                        persistSettings();
                        render();
                    };
                }

                document.querySelectorAll('[data-set-card-style]').forEach(b => {
                    b.onclick = () => {
                        appSettings.cardStyle = b.dataset.setCardStyle;
                        persistSettings();
                        applyTheme();
                        sfxClick();
                        render();
                    };
                });

                document.querySelectorAll('[data-set-radius]').forEach(b => {
                    b.onclick = () => {
                        appSettings.radius = b.dataset.setRadius;
                        persistSettings();
                        applyTheme();
                        sfxClick();
                        render();
                    };
                });

                document.querySelectorAll('[data-set-bg]').forEach(b => {
                    b.onclick = () => {
                        appSettings.bgStyle = b.dataset.setBg;
                        persistSettings();
                        applyTheme();
                        sfxClick();
                        render();
                    };
                });

                document.querySelectorAll('[data-toggle]').forEach(b => {
                    b.onclick = () => {
                        const key = b.dataset.toggle;
                        appSettings[key] = !appSettings[key];
                        persistSettings();
                        applyTheme();
                        sfxClick();
                        haptic('light');
                        render();
                    };
                });

                const botInput = document.getElementById('set-bot-user');
                const saveBotAction = () => {
                    if (!botInput) return;
                    appSettings.botUsername = botInput.value.trim().replace(/^@/, '');
                    persistSettings();
                    sfxSuccess();
                    showToast('Username бота сохранён!', 'success');
                };
                const saveBotBtn = document.getElementById('btn-save-bot');
                if (saveBotBtn) saveBotBtn.onclick = saveBotAction;
                if (botInput) botInput.onkeydown = (e) => { if (e.key === 'Enter') saveBotAction(); };

                const resetAllBtn = document.getElementById('btn-reset-all-settings');
                if (resetAllBtn) resetAllBtn.onclick = () => {
                    Object.assign(appSettings, JSON.parse(JSON.stringify(DEFAULT_SETTINGS)));
                    persistSettings();
                    applyTheme();
                    sfxClick();
                    showToast('Настройки сброшены по умолчанию', 'info');
                    render();
                };

                const rulesBtn = document.getElementById('btn-show-rules');
                if (rulesBtn) rulesBtn.onclick = () => {
                    sfxClick();
                    openModal(`
                        <div class="flex items-center justify-between mb-3">
                            <div class="font-extrabold text-base">📖 Как играть</div>
                            <button onclick="window.__closeModal()" class="w-8 h-8 rounded-full btn-secondary text-sm font-bold">✕</button>
                        </div>
                        <div class="space-y-3 text-xs leading-relaxed" style="color: var(--text-muted);">
                            <p><b class="text-white">🕵️‍♂️ Обычный режим:</b> Все мирные получают одну и ту же карту/слово, а шпион не знает слово. Задавайте наводящие вопросы, чтобы вычислить шпиона, но не спалите слово!</p>
                            <p><b class="text-white">🎭 Под прикрытием:</b> Мирные получают одну карту (например, <i>Ледяной голем</i>), а шпион получает очень похожую (<i>Голем</i>). Шпион сам не знает, что он шпион!</p>
                            <p><b class="text-white">🔥 Последний шанс:</b> Если шпиона раскрыли на голосовании, у него есть последняя попытка назвать слово мирных. Угадает — победа его!</p>
                        </div>
                    `);
                };

                const secretEmptyZone = document.getElementById('settings-secret-empty-zone');
                if (secretEmptyZone) {
                    secretEmptyZone.onclick = (e) => {
                        e.preventDefault();
                        e.stopPropagation();
                        handleSecretEmptyTap();
                    };
                }
            }
        }

        // =========================================================================
        // 12. ИНИЦИАЛИЗАЦИЯ, НАВИГАЦИЯ, DEEP-LINK И ОБЛАЧНОЕ СОХРАНЕНИЕ
        // =========================================================================
        window.__closeModal = closeModal;

        document.querySelectorAll('.nav-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const target = btn.dataset.nav;
                if (!target) return;
                currentTab = target;
                activeView = target;
                sfxClick();
                haptic('light');
                render();
            });
        });

        let pendingDeepLinkCode = null;

        function checkDeepLink() {
            let roomParam = null;
            try {
                const params = new URLSearchParams(window.location.search);
                roomParam = params.get('room') || params.get('tgWebAppStartParam');
            } catch {}
            if (!roomParam && tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param) {
                roomParam = tg.initDataUnsafe.start_param;
            }
            if (roomParam) {
                const code = String(roomParam).replace(/\D/g, '').slice(0, 4);
                if (code.length === 4) {
                    if (typeof Peer !== 'undefined') joinOnlineRoom(code);
                    else pendingDeepLinkCode = code;
                }
            }
        }

        function loadExternalScript(src, onLoad) {
            try {
                const s = document.createElement('script');
                s.src = src;
                s.async = true;
                s.onload = () => { if (typeof onLoad === 'function') onLoad(); };
                document.head.appendChild(s);
            } catch {}
        }

        function syncFromCloudStorage() {
            try {
                if (!tg || !tg.CloudStorage || typeof tg.CloudStorage.getItems !== 'function') return;
                const keys = [
                    STORAGE_KEYS.SETTINGS,
                    'spy_guest_user',
                    STORAGE_KEYS.ROOM_DEFAULTS,
                    STORAGE_KEYS.PASS_DEFAULTS
                ];
                tg.CloudStorage.getItems(keys, (err, vals) => {
                    if (err || !vals) return;
                    let changed = false;
                    if (vals[STORAGE_KEYS.SETTINGS]) {
                        try {
                            const cs = JSON.parse(vals[STORAGE_KEYS.SETTINGS]);
                            Object.assign(appSettings, cs);
                            appSettings.customTheme = Object.assign({}, DEFAULT_CUSTOM_THEME, cs.customTheme || {});
                            saveJson(STORAGE_KEYS.SETTINGS, appSettings);
                            changed = true;
                        } catch {}
                    }
                    if (vals['spy_guest_user']) {
                        try {
                            const cu = JSON.parse(vals['spy_guest_user']);
                            if (cu.customName) { currentUser.name = cu.customName; currentUser.customName = cu.customName; }
                            if (cu.avatar) currentUser.avatar = cu.avatar;
                            saveJson('spy_guest_user', currentUser);
                            changed = true;
                        } catch {}
                    }
                    if (vals[STORAGE_KEYS.ROOM_DEFAULTS]) {
                        try {
                            Object.assign(roomDefaults, JSON.parse(vals[STORAGE_KEYS.ROOM_DEFAULTS]));
                            saveJson(STORAGE_KEYS.ROOM_DEFAULTS, roomDefaults);
                        } catch {}
                    }
                    if (vals[STORAGE_KEYS.PASS_DEFAULTS]) {
                        try {
                            Object.assign(passDefaults, JSON.parse(vals[STORAGE_KEYS.PASS_DEFAULTS]));
                            saveJson(STORAGE_KEYS.PASS_DEFAULTS, passDefaults);
                        } catch {}
                    }
                    if (changed) {
                        applyTheme();
                        render();
                    }
                });
            } catch {}
        }

        function initTgSdkLate() {
            if (!tg && window.Telegram && window.Telegram.WebApp) {
                tg = window.Telegram.WebApp;
                try { tg.ready(); tg.expand(); } catch {}
                applyTheme();
                syncFromCloudStorage();
                checkDeepLink();
            }
        }

        window.addEventListener('load', initTgSdkLate);

        try {
            applyTheme();
            render();
            checkDeepLink();
            syncFromCloudStorage();
        } catch (err) {
            const root = document.getElementById('app-root');
            if (root) {
                root.innerHTML = `<div class="p-4 text-xs text-red-300">Ошибка запуска: ${escHtml(err && err.message ? err.message : err)}</div>`;
            }
        }

        // Подгружаем сетевые библиотеки в фоне, чтобы интерфейс открывался мгновенно
        loadExternalScript('https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js', () => {
            if (pendingDeepLinkCode) {
                const code = pendingDeepLinkCode;
                pendingDeepLinkCode = null;
                joinOnlineRoom(code);
            }
        });
        loadExternalScript('https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js', () => {
            initOpenRoomsDirectory();
        });
    })();
    </script>
</body>
</html>
