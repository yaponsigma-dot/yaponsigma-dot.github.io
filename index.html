        /* Чёткий рендеринг для пиксельных шрифтов */
        body[data-font="determination"] * {
            letter-spacing: 0.025em;
            -webkit-font-smoothing: none;
        }
        body[data-font="determination"] .font-black,
        body[data-font="determination"] .font-extrabold,
        body[data-font="determination"] .font-bold {
            font-weight: 400 !important;
        }

        /* Варианты скругления и стилей карточек */
        body[data-radius="sharp"] .glass-card,
        body[data-radius="sharp"] .role-card-inner { border-radius: 10px !important; }
        body[data-radius="sharp"] .btn-primary,
        body[data-radius="sharp"] .btn-secondary,
        body[data-radius="sharp"] .btn-danger,
        body[data-radius="sharp"] .field-input { border-radius: 8px !important; }

        body[data-radius="pill"] .glass-card,
        body[data-radius="pill"] .role-card-inner { border-radius: 30px !important; }
        body[data-radius="pill"] .btn-primary,
        body[data-radius="pill"] .btn-secondary,
        body[data-radius="pill"] .btn-danger,
        body[data-radius="pill"] .field-input { border-radius: 22px !important; }

        body[data-card-style="solid"] .glass-card {
            background: var(--bg-card-solid);
            backdrop-filter: none;
            -webkit-backdrop-filter: none;
        }
        body[data-card-style="neon"] .glass-card {
            border-color: var(--accent);
            box-shadow: 0 0 18px -6px var(--accent-glow), inset 0 0 12px -8px var(--accent-glow);
        }
        body[data-card-style="minimal"] .glass-card {
            background: transparent;
            backdrop-filter: none;
            -webkit-backdrop-filter: none;
            border-color: var(--border-color);
        }

        /* Варианты фона */
        body[data-bg-style="none"] .ambient-bg { display: none; }
        body[data-bg-style="grid"] .ambient-orb-1,
        body[data-bg-style="grid"] .ambient-orb-2 { opacity: 0.25; }
        body[data-bg-style="grid"] .ambient-bg::after {
            content: '';
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(to right, rgba(148, 163, 184, 0.06) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(148, 163, 184, 0.06) 1px, transparent 1px);
            background-size: 28px 28px;
        }

        /* Компактный режим */
        body[data-compact="true"] main { padding-top: 10px; }
        body[data-compact="true"] .glass-card { padding: 12px !important; }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            font-family: var(--font-main);
        }

        html, body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
            user-select: none;
            transition: background-color 0.25s ease, color 0.25s ease;
        }

        input, textarea, select {
            user-select: text;
        }

        /* Фоновое мягкое свечение */
        .ambient-bg {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .ambient-orb-1 {
            position: absolute;
            top: -120px;
            right: -80px;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%);
            filter: blur(28px);
        }

        .ambient-orb-2 {
            position: absolute;
            bottom: -100px;
            left: -90px;
            width: 280px;
            height: 280px;
            border-radius: 50%;
            background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%);
            filter: blur(36px);
            opacity: 0.7;
        }

        .glass-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            color: #ffffff;
            box-shadow: 0 8px 24px -6px var(--accent-glow);
            transition: transform 0.14s ease, filter 0.14s ease, opacity 0.14s ease;
        }

        .btn-primary:active {
            transform: scale(0.97);
            filter: brightness(1.08);
        }

        .btn-secondary {
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            transition: transform 0.14s ease, background 0.14s ease;
        }

        .btn-secondary:active {
            transform: scale(0.97);
        }

        .btn-danger {
            background: rgba(239, 68, 68, 0.14);
            border: 1px solid rgba(239, 68, 68, 0.35);
            color: #f87171;
            transition: transform 0.14s ease;
        }

        .btn-danger:active {
            transform: scale(0.97);
        }

        .field-input {
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .field-input option {
            background: #111827;
            color: #f8fafc;
        }

        .field-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        .role-card-wrap { perspective: 1000px; }

        .role-card-inner {
            transition: transform 0.38s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.3s ease;
        }

        .role-card-inner:active { transform: scale(0.985); }

        .spy-glow {
            background: linear-gradient(145deg, rgba(239, 68, 68, 0.22), rgba(245, 158, 11, 0.12));
            border: 1.5px solid rgba(239, 68, 68, 0.5);
            box-shadow: 0 12px 35px -8px rgba(239, 68, 68, 0.35);
        }

        .civ-glow {
            background: linear-gradient(145deg, rgba(99, 102, 241, 0.22), rgba(16, 185, 129, 0.14));
            border: 1.5px solid rgba(99, 102, 241, 0.45);
            box-shadow: 0 12px 35px -8px var(--accent-glow);
        }

        .hidden-glow {
            background: repeating-linear-gradient(
                -45deg,
                rgba(148, 163, 184, 0.05),
                rgba(148, 163, 184, 0.05) 12px,
                rgba(148, 163, 184, 0.09) 12px,
                rgba(148, 163, 184, 0.09) 24px
            );
            border: 1.5px dashed var(--border-color);
        }

        .fade-in { animation: fadeInUp 0.24s cubic-bezier(0.22, 1, 0.36, 1); }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .pulse-dot { animation: pulseDot 1.8s infinite; }

        @keyframes pulseDot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.45; transform: scale(0.85); }
        }

        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.25); border-radius: 99px; }

        /* Тумблер (Switch) */
        .toggle-track {
            width: 46px;
            height: 26px;
            border-radius: 999px;
            background: rgba(148, 163, 184, 0.28);
            position: relative;
            transition: background 0.2s ease;
            flex-shrink: 0;
        }
        .toggle-track.active { background: var(--accent); }
        .toggle-thumb {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #ffffff;
            position: absolute;
            top: 3px;
            left: 3px;
            transition: transform 0.2s cubic-bezier(0.22, 1, 0.36, 1);
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.25);
        }
        .toggle-track.active .toggle-thumb { transform: translateX(20px); }

        /* Скрытое перетаскиваемое чит-меню и его невидимый камуфляжный триггер */
        #cheat-widget {
            position: fixed;
            z-index: 60;
            width: 285px;
            max-width: calc(100vw - 20px);

        let audioCtx = null;

        function playTone(freq, duration = 0.09, type = 'sine', vol = 0.12) {
            if (!appSettings.sound) return;
            try {
                if (!audioCtx) {
                    const AC = window.AudioContext || window.webkitAudioContext;
                    audioCtx = new AC();
                }
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(vol, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch {}
        }

        function sfxClick() { playTone(520, 0.05, 'triangle', 0.07); }
        function sfxSuccess() {
            playTone(523, 0.09, 'sine', 0.1);
            setTimeout(() => playTone(659, 0.12, 'sine', 0.1), 85);
            setTimeout(() => playTone(784, 0.18, 'sine', 0.12), 170);
        }
        function sfxAlert() {
            playTone(260, 0.14, 'sawtooth', 0.09);
            setTimeout(() => playTone(195, 0.22, 'sawtooth', 0.1), 130);
        }
        function sfxReveal() {

                    } else {

                    }
                } else if (navigator.vibrate) {

                }
            } catch {}
        }

        function escHtml(str) {
            return String(str || '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function normWord(s) {
            return String(s || '')
                .trim()
                .toLowerCase()
                .replace(/ё/g, 'е')
                .replace(/[.,\-!?"'«»]/g, ' ')
                .replace(/\s+/g, ' ')

        function showToast(msg, type = 'info') {
            const container = document.getElementById('toast-container');

            const colors = {

                success: 'border-emerald-400/50 bg-emerald-950/95 text-emerald-100',
                error: 'border-red-400/50 bg-red-950/95 text-red-100',
                warn: 'border-amber-400/50 bg-amber-950/95 text-amber-100'
            };
            const el = document.createElement('div');
            el.className = `px-4 py-2.5 rounded-2xl border text-xs font-semibold shadow-xl backdrop-blur-md text-center fade-in ${colors[type] || colors.info}`;
            el.textContent = msg;
            container.appendChild(el);
            setTimeout(() => {
                el.style.opacity = '0';
                el.style.transform = 'translateY(-6px)';
                el.style.transition = 'all 0.2s ease';
                setTimeout(() => el.remove(), 220);

        function hexToRgba(hex, alpha = 1) {
            const clean = String(hex || '#1e293b').replace('#', '');
            if (clean.length !== 6) return `rgba(30, 41, 59, ${alpha})`;
            const r = parseInt(clean.slice(0, 2), 16);
            const g = parseInt(clean.slice(2, 4), 16);
            const b = parseInt(clean.slice(4, 6), 16);
            return `rgba(${r}, ${g}, ${b}, ${alpha})`;
        }

        function isHexLight(hex) {
            const clean = String(hex || '#090d16').replace('#', '');
            if (clean.length !== 6) return false;
            const r = parseInt(clean.slice(0, 2), 16);
            const g = parseInt(clean.slice(2, 4), 16);
            const b = parseInt(clean.slice(4, 6), 16);
            return (0.299 * r + 0.587 * g + 0.114 * b) > 165;
        }

        function clampCheatCoords(w = 285, h = 160) {
            const vw = window.innerWidth || document.documentElement.clientWidth || 360;

            const cy = Number.isFinite(cheatState.y) ? cheatState.y : Math.round(vh * 0.45);
            cheatState.x = Math.max(8, Math.min(cx, maxX));

        // =========================================================================
        // 6. СИСТЕМА ОТКРЫТЫХ КОМНАТ (LIVE LOBBY DIRECTORY ЧЕРЕЗ MQTT OVER WSS)
        // =========================================================================
        const MQTT_BROKER = 'wss://broker.emqx.io:8084/mqtt';
        const MQTT_ROOM_PREFIX = 'tgspyapp_v2_lobby_2026/rooms/';

        const lobbyDir = {
            client: null,
            connected: false,
            rooms: {},
            heartbeatTimer: null
        };

        function initOpenRoomsDirectory() {
            if (typeof mqtt === 'undefined' || lobbyDir.client) return;
            try {
                const c = mqtt.connect(MQTT_BROKER, {
                    clientId: 'spy_' + currentUser.id + '_' + Math.random().toString(16).slice(2, 6),
                    clean: true,
                    connectTimeout: 7000,
                    reconnectPeriod: 5000
                });
                lobbyDir.client = c;

                c.on('connect', () => {
                    lobbyDir.connected = true;
                    c.subscribe(MQTT_ROOM_PREFIX + '+');
                    if (net.isHost && hostRoom) publishHostRoomToLobby();
                    if (activeView === 'home') render();
                });

                c.on('close', () => { lobbyDir.connected = false; });

                c.on('message', (topic, message) => {
                    const code = topic.slice(MQTT_ROOM_PREFIX.length);
                    if (!/^\d{4}$/.test(code)) return;
                    const txt = message ? message.toString() : '';
                    if (!txt) {
                        delete lobbyDir.rooms[code];
                    } else {
                        try {
                            const info = JSON.parse(txt);
                            if (info && info.state === 'lobby' && info.isPublic !== false) {
                                lobbyDir.rooms[code] = info;
                            } else {
                                delete lobbyDir.rooms[code];
                            }
                        } catch {
                            delete lobbyDir.rooms[code];
                        }
                    }
                    if (activeView === 'home') render();
                });
            } catch {}
        }

        function getActiveOpenRooms() {
            const now = Date.now();
            return Object.values(lobbyDir.rooms)
                .filter(r => r && r.state === 'lobby' && (now - (r.ts || 0)) < 55000)
                .sort((a, b) => (b.ts || 0) - (a.ts || 0));
        }

        function publishHostRoomToLobby() {
            if (!lobbyDir.client || !lobbyDir.connected || !net.isHost || !hostRoom) return;
            const topic = MQTT_ROOM_PREFIX + hostRoom.code;
            if (!hostRoom.isPublic || hostRoom.state !== 'lobby') {
                try { lobbyDir.client.publish(topic, '', { retain: true, qos: 0 }); } catch {}
                return;
            }
            const packs = getAllPacks();
            const pk = packs[hostRoom.packId] || DEFAULT_PACKS.cr;
            const payload = JSON.stringify({
                code: hostRoom.code,
                title: hostRoom.title,
                hostName: currentUser.name,
                packTitle: pk.title,
                mode: hostRoom.mode,
                playersCount: hostRoom.players.length,
                maxPlayers: hostRoom.maxPlayers,
                tag: hostRoom.tag || '',
                isPublic: true,
                state: hostRoom.state,
                ts: Date.now()
            });
            try { lobbyDir.client.publish(topic, payload, { retain: true, qos: 0 }); } catch {}
        }

        function unpublishHostRoomFromLobby(code) {
            if (!lobbyDir.client || !lobbyDir.connected || !code) return;
            try { lobbyDir.client.publish(MQTT_ROOM_PREFIX + code, '', { retain: true, qos: 0 }); } catch {}
        }

        function startHostHeartbeat() {
            stopHostHeartbeat();
            publishHostRoomToLobby();
            lobbyDir.heartbeatTimer = setInterval(() => {
                if (net.isHost && hostRoom) publishHostRoomToLobby();
                else stopHostHeartbeat();
            }, 18000);
        }

        function stopHostHeartbeat() {
            if (lobbyDir.heartbeatTimer) {
                clearInterval(lobbyDir.heartbeatTimer);
                lobbyDir.heartbeatTimer = null;
            }
        }

        setInterval(() => {
            const now = Date.now();
            let changed = false;
            for (const [c, r] of Object.entries(lobbyDir.rooms)) {
                if ((now - (r.ts || 0)) >= 55000) {
                    delete lobbyDir.rooms[c];
                    changed = true;
                }
            }
            if (changed && activeView === 'home') render();
        }, 15000);

        window.addEventListener('beforeunload', () => {
            if (net.isHost && hostRoom) unpublishHostRoomFromLobby(hostRoom.code);
        });

        // =========================================================================
        // 7. ЛОГИКА РАЗДАЧИ РОЛЕЙ И P2P СЕТИ (PEERJS)
        // =========================================================================
        function pickRoundWords(pack, mode) {
            let card = '';
            let spyCard = '';

            if (mode === 'undercover') {
                if (pack.pairs && pack.pairs.length > 0) {
                    const pair = pack.pairs[Math.floor(Math.random() * pack.pairs.length)];
                    if (Math.random() < 0.5) {
                        card = pair[0]; spyCard = pair[1];
                    } else {
                        card = pair[1]; spyCard = pair[0];
                    }
                } else {
                    const shuffled = [...pack.items].sort(() => Math.random() - 0.5);
                    card = shuffled[0] || 'Слово 1';
                    spyCard = shuffled[1] || shuffled[0] || 'Слово 2';
                }

                if (adminCheats.forceCard) {
                    card = adminCheats.forceCard;
                    if (pack.pairs && !adminCheats.forceSpyCard) {
                        const match = pack.pairs.find(p => normWord(p[0]) === normWord(card) || normWord(p[1]) === normWord(card));
                        if (match) spyCard = normWord(match[0]) === normWord(card) ? match[1] : match[0];
                    }
                    adminCheats.forceCard = '';
                }
                if (adminCheats.forceSpyCard) {
                    spyCard = adminCheats.forceSpyCard;
                    adminCheats.forceSpyCard = '';
                }
            } else {
                card = adminCheats.forceCard || pack.items[Math.floor(Math.random() * pack.items.length)];
                spyCard = '';
                adminCheats.forceCard = '';
                adminCheats.forceSpyCard = '';
            }
            return { card, spyCard };
        }

        function pickSpies(playerIds, count, meId = null) {
            const maxSpies = Math.max(1, Math.min(count, Math.max(1, playerIds.length - 1)));
            const chosen = [];

            const resolvedForce = adminCheats.forceSpyId === '__ME__' ? meId : adminCheats.forceSpyId;
            const resolvedAvoid = adminCheats.avoidSpyId === '__ME__' ? meId : adminCheats.avoidSpyId;

            if (resolvedForce && playerIds.includes(resolvedForce)) {
                chosen.push(resolvedForce);
                adminCheats.forceSpyId = null;
            }

            let pool = playerIds.filter(id => !chosen.includes(id));
            if (resolvedAvoid && pool.length > (maxSpies - chosen.length)) {
                pool = pool.filter(id => id !== resolvedAvoid);
                adminCheats.avoidSpyId = null;
            }

            while (chosen.length < maxSpies && pool.length > 0) {
                const idx = Math.floor(Math.random() * pool.length);
                chosen.push(pool.splice(idx, 1)[0]);
            }
            return chosen;
        }

        function rememberRoom(code, title) {
            recentRooms = recentRooms.filter(r => r.code !== code);
            recentRooms.unshift({ code, title, ts: Date.now() });
            recentRooms = recentRooms.slice(0, 5);
            saveJson(STORAGE_KEYS.RECENT_ROOMS, recentRooms);
        }

        function cleanupNetwork() {
            if (net.isHost && hostRoom) unpublishHostRoomFromLobby(hostRoom.code);
            stopHostHeartbeat();
            if (net.hostConn) {
                try { net.hostConn.close(); } catch {}
                net.hostConn = null;
            }
            Object.values(net.clientConns).forEach(c => { try { c.close(); } catch {} });
            net.clientConns = {};
            if (net.peer) {
                try { net.peer.destroy(); } catch {}
                net.peer = null;
            }
            net.isHost = false;
            net.roomCode = null;
            net.connecting = false;
            hostRoom = null;
            clientView = null;
            showVotePanel = false;
            roleHidden = false;
            stopTimerLoop();
        }

        function createOnlineRoom() {
            if (typeof Peer === 'undefined') {
                showToast('PeerJS не загрузился. Используй режим «На одном телефоне»!', 'error');
                return;
            }
            cleanupNetwork();
            net.connecting = true;
            const code = String(Math.floor(1000 + Math.random() * 9000));
            render();

            try {
                const peer = new Peer(PEER_PREFIX + code, { debug: 0 });
                net.peer = peer;

                peer.on('open', () => {
                    net.connecting = false;
                    net.isHost = true;
                    net.roomCode = code;
                    const packs = getAllPacks();
                    const savedPack = packs[roomDefaults.packId] ? roomDefaults.packId : 'cr';
                    hostRoom = {
                        code,
                        title: roomDefaults.title ? roomDefaults.title : `Комната #${code}`,
                        tag: roomDefaults.tag || '',
                        isPublic: roomDefaults.isPublic !== false,
                        hostId: currentUser.id,
                        maxPlayers: roomDefaults.maxPlayers || 8,
                        mode: roomDefaults.mode || 'classic',
                        packId: savedPack,
                        spyCount: roomDefaults.spyCount || 1,
                        timerMin: Number.isFinite(roomDefaults.timerMin) ? roomDefaults.timerMin : appSettings.defaultTimer,
                        state: 'lobby',
                        players: [{
                            id: currentUser.id,
                            name: currentUser.name,
                            username: currentUser.username,
                            avatar: currentUser.avatar,
                            isHost: true
                        }],
                        spyIds: [],
                        card: '',
                        spyCard: '',
                        votes: {},
                        roundEndTime: 0,
                        lastResult: null,
                        lastChanceSpyId: null,
                        votesSummary: []
                    };
                    rememberRoom(code, hostRoom.title);
                    activeView = 'online_room';
                    startHostHeartbeat();
                    syncHostToAll();
                    sfxSuccess();
                    haptic('medium');
                    showToast(`Комната ${code} открыта!`, 'success');
                });

                peer.on('connection', (conn) => {
                    conn.on('data', (msg) => handleHostIncoming(conn, msg));
                    conn.on('close', () => {
                        if (!hostRoom) return;
                        const pid = Object.keys(net.clientConns).find(k => net.clientConns[k] === conn);
                        if (pid) {
                            delete net.clientConns[pid];
                            const leftPlayer = hostRoom.players.find(p => p.id === pid);
                            hostRoom.players = hostRoom.players.filter(p => p.id !== pid);
                            delete hostRoom.votes[pid];
                            if (leftPlayer) showToast(`${leftPlayer.name} вышел из комнаты`, 'info');
                            syncHostToAll();
                        }
                    });
                });

                peer.on('error', (err) => {
                    net.connecting = false;
                    if (err && err.type === 'unavailable-id') {
                        createOnlineRoom();
                        return;
                    }
                    showToast('Ошибка сети P2P. Проверь интернет или играй на 1 телефоне.', 'error');
                    cleanupNetwork();
                    activeView = 'home';
                    render();
                });
            } catch {
                net.connecting = false;
                showToast('Не удалось создать комнату', 'error');
                activeView = 'home';
                render();
            }
        }

        function joinOnlineRoom(rawCode) {
            const code = String(rawCode || '').replace(/\D/g, '').slice(0, 4);
            if (code.length !== 4) {
                showToast('Введи 4 цифры кода комнаты', 'warn');
                return;
            }
            if (typeof Peer === 'undefined') {
                showToast('Нет подключения к сети P2P', 'error');
                return;
            }
            cleanupNetwork();
            net.connecting = true;
            net.roomCode = code;
            render();

            let connected = false;
            const timeout = setTimeout(() => {
                if (!connected) {
                    showToast(`Комната ${code} не отвечает. Проверь код у ведущего.`, 'error');
                    cleanupNetwork();
                    activeView = 'home';
                    render();
                }
            }, 9000);

            try {
                const peer = new Peer(undefined, { debug: 0 });
                net.peer = peer;

                peer.on('open', () => {
                    const conn = peer.connect(PEER_PREFIX + code, { reliable: true });
                    net.hostConn = conn;

                    conn.on('open', () => {
                        connected = true;
                        clearTimeout(timeout);
                        conn.send({ type: 'join', user: currentUser });
                    });

                    conn.on('data', (msg) => {
                        if (msg.type === 'error') {
                            showToast(msg.message || 'Ошибка входа', 'error');
                            cleanupNetwork();
                            activeView = 'home';
                            render();
                        } else if (msg.type === 'state') {
                            net.connecting = false;
                            const prevState = clientView ? clientView.state : null;
                            clientView = msg.payload;
                            rememberRoom(clientView.code, clientView.title);
                            activeView = 'online_room';
                            if (prevState !== clientView.state) {
                                showVotePanel = false;
                                roleHidden = false;
                                if (clientView.state === 'playing') { sfxReveal(); haptic('medium'); }
                                if (clientView.state === 'last_chance') { sfxAlert(); haptic('warning'); }
                                if (clientView.state === 'results') { sfxSuccess(); haptic('success'); }
                            }
                            ensureTimerLoop();
                            render();
                        } else if (msg.type === 'toast') {
                            showToast(msg.message, msg.kind || 'info');
                        } else if (msg.type === 'closed') {
                            showToast('Ведущий закрыл комнату', 'warn');
                            cleanupNetwork();
                            activeView = 'home';
                            render();
                        }
                    });

                    conn.on('close', () => {
                        if (activeView === 'online_room') {
                            showToast('Связь с комнатой потеряна', 'warn');
                            cleanupNetwork();
                            activeView = 'home';
                            render();
                        }
                    });
                });

                peer.on('error', () => {
                    clearTimeout(timeout);
                    showToast(`Комната ${code} не найдена`, 'error');
                    cleanupNetwork();
                    activeView = 'home';
                    render();
                });
            } catch {
                clearTimeout(timeout);
                cleanupNetwork();
                activeView = 'home';
                render();
            }
        }

        function buildPlayerSnapshot(pid) {
            const packs = getAllPacks();
            const pk = packs[hostRoom.packId] || DEFAULT_PACKS.cr;
            const isSpy = hostRoom.spyIds.includes(pid);
            let myCard = '';
            let myRole = 'civilian';

            if (hostRoom.state === 'playing' || hostRoom.state === 'last_chance') {
                if (hostRoom.mode === 'undercover') {
                    myRole = 'undercover_unknown';
                    myCard = isSpy ? hostRoom.spyCard : hostRoom.card;
                } else {
                    myRole = isSpy ? 'spy' : 'civilian';
                    myCard = isSpy ? '' : hostRoom.card;
                }
            }

            return {
                code: hostRoom.code,
                title: hostRoom.title,
                tag: hostRoom.tag || '',
                isPublic: hostRoom.isPublic !== false,
                hostId: hostRoom.hostId,
                maxPlayers: hostRoom.maxPlayers,
                mode: hostRoom.mode,
                packId: hostRoom.packId,
                packTitle: pk.title,
                itemLabel: pk.itemLabel || 'Загадано',
                spyCount: hostRoom.spyCount,
                timerMin: hostRoom.timerMin,
                state: hostRoom.state,
                players: hostRoom.players,
                myRole,
                myCard,
                myVote: hostRoom.votes[pid] || null,
                votedCount: Object.keys(hostRoom.votes).length,
                roundEndTime: hostRoom.roundEndTime,
                lastChanceSpyName: hostRoom.lastChanceSpyId
                    ? (hostRoom.players.find(p => p.id === hostRoom.lastChanceSpyId)?.name || 'Шпион')
                    : '',
                isMyLastChance: hostRoom.state === 'last_chance' && hostRoom.lastChanceSpyId === pid,
                votesSummary: hostRoom.votesSummary || [],
                lastResult: hostRoom.state === 'results' ? hostRoom.lastResult : null,
                _intel: {
                    spyNames: hostRoom.spyIds.map(sid => hostRoom.players.find(p => p.id === sid)?.name || sid),
                    card: hostRoom.card,
                    spyCard: hostRoom.spyCard,
                    mode: hostRoom.mode,
                    votesList: Object.entries(hostRoom.votes).map(([vid, tid]) => ({
                        voter: hostRoom.players.find(p => p.id === vid)?.name || 'Игрок',
                        target: hostRoom.players.find(p => p.id === tid)?.name || 'Игрок'
                    }))
                }
            };
        }

        function syncHostToAll() {
            if (!net.isHost || !hostRoom) return;
            publishHostRoomToLobby();
            clientView = buildPlayerSnapshot(currentUser.id);
            for (const [pid, conn] of Object.entries(net.clientConns)) {
                if (conn && conn.open) {
                    try { conn.send({ type: 'state', payload: buildPlayerSnapshot(pid) }); } catch {}
                }
            }
            ensureTimerLoop();
            render();
        }

        function sendToHost(payload) {
            if (net.isHost) {
                handleHostIncoming(null, payload, currentUser.id);
            } else if (net.hostConn && net.hostConn.open) {
                net.hostConn.send(payload);
            }
        }

        function handleHostIncoming(conn, msg, localSenderId = null) {
            if (!hostRoom) return;
            const senderId = localSenderId || (msg.user && msg.user.id) || msg.uid;

            if (msg.type === 'join' && conn) {
                const u = msg.user;
                if (hostRoom.state !== 'lobby') {
                    conn.send({ type: 'error', message: 'В комнате уже идёт раунд!' });
                    setTimeout(() => conn.close(), 300);
                    return;
                }
                const exists = hostRoom.players.find(p => p.id === u.id);
                if (!exists && hostRoom.players.length >= hostRoom.maxPlayers) {
                    conn.send({ type: 'error', message: `Комната заполнена (${hostRoom.maxPlayers}/${hostRoom.maxPlayers})` });
                    setTimeout(() => conn.close(), 300);
                    return;
                }
                net.clientConns[u.id] = conn;
                if (!exists) {
                    hostRoom.players.push({
                        id: u.id,
                        name: u.name,
                        username: u.username || '',
                        avatar: u.avatar || '🕵️‍♂️',
                        isHost: false
                    });
                    showToast(`${u.name} зашёл в комнату!`, 'success');
                    sfxClick();
                }
                syncHostToAll();
                return;
            }

            if (msg.type === 'vote' && hostRoom.state === 'playing') {
                if (hostRoom.players.some(p => p.id === msg.targetId)) {
                    hostRoom.votes[senderId] = msg.targetId;
                    if (Object.keys(hostRoom.votes).length >= hostRoom.players.length) {
                        finishOnlineVoting(false);
                    } else {
                        syncHostToAll();
                    }
                }
                return;
            }

            if (msg.type === 'spy_guess') {
                const isLast = hostRoom.state === 'last_chance' && hostRoom.lastChanceSpyId === senderId;
                const isEarly = hostRoom.state === 'playing' && hostRoom.spyIds.includes(senderId) && hostRoom.mode === 'classic';
                if (isLast || isEarly) {
                    resolveOnlineGuess(senderId, msg.word, isLast);
                }
            }
        }

        function startOnlineRound() {
            if (!net.isHost || !hostRoom) return;
            const minReq = hostRoom.maxPlayers === 1 ? 1 : 2;
            if (hostRoom.players.length < minReq) {
                showToast(`Нужно минимум ${minReq} игрока (или выбери лимит 1 для теста)`, 'warn');
                return;
            }

            const packs = getAllPacks();
            const pk = packs[hostRoom.packId] || DEFAULT_PACKS.cr;
            const { card, spyCard } = pickRoundWords(pk, hostRoom.mode);
            const pIds = hostRoom.players.map(p => p.id);
            const spies = pickSpies(pIds, hostRoom.spyCount, currentUser.id);

            hostRoom.state = 'playing';
            hostRoom.card = card;
            hostRoom.spyCard = spyCard;
            hostRoom.spyIds = spies;
            hostRoom.votes = {};
            hostRoom.lastChanceSpyId = null;
            hostRoom.lastResult = null;
            hostRoom.votesSummary = [];
            hostRoom.roundEndTime = hostRoom.timerMin > 0 ? (Date.now() + hostRoom.timerMin * 60 * 1000) : 0;

            showVotePanel = false;
            roleHidden = false;
            sfxReveal();
            haptic('medium');
            syncHostToAll();
        }

        function finishOnlineVoting(forceEnd = false) {
            if (!net.isHost || !hostRoom) return;
            const tally = {};
            Object.values(hostRoom.votes).forEach(tid => {
                tally[tid] = (tally[tid] || 0) + 1;
            });

            const summary = Object.entries(tally)
                .sort((a, b) => b[1] - a[1])
                .map(([tid, count]) => ({
                    id: tid,
                    name: hostRoom.players.find(p => p.id === tid)?.name || 'Игрок',
                    count
                }));

            hostRoom.votesSummary = summary;
            let caughtSpyId = null;

            if (summary.length > 0) {
                const maxVotes = summary[0].count;
                const leaders = summary.filter(s => s.count === maxVotes);
                if (leaders.length === 1 && hostRoom.spyIds.includes(leaders[0].id)) {
                    caughtSpyId = leaders[0].id;
                }
            }

            if (caughtSpyId && !forceEnd && hostRoom.state !== 'last_chance') {
                hostRoom.state = 'last_chance';
                hostRoom.lastChanceSpyId = caughtSpyId;
                sfxAlert();
                haptic('warning');
                syncHostToAll();
                return;
            }

            const spyNames = hostRoom.spyIds.map(sid => hostRoom.players.find(p => p.id === sid)?.name || 'Игрок');
            const civiliansWon = Boolean(caughtSpyId);

            hostRoom.state = 'results';
            hostRoom.lastResult = {
                winner: civiliansWon ? 'civilians' : 'spy',
                headline: civiliansWon ? '🎉 Мирные победили!' : '🕵️‍♂️ Шпион победил!',
                subtext: civiliansWon
                    ? 'Шпион был раскрыт и не смог спастись.'
                    : (summary.length ? 'Мирные ошиблись на голосовании!' : 'Раунд завершён ведущим.'),
                spyNames,
                card: hostRoom.card,
                spyCard: hostRoom.mode === 'undercover' ? hostRoom.spyCard : '',
                summary
            };

            sfxSuccess();
            haptic('success');
            syncHostToAll();
        }

        function resolveOnlineGuess(spyId, guessText, isLastChance) {
            if (!net.isHost || !hostRoom) return;
            const win = normWord(guessText) === normWord(hostRoom.card);
            const spyName = hostRoom.players.find(p => p.id === spyId)?.name || 'Шпион';
            const spyNames = hostRoom.spyIds.map(sid => hostRoom.players.find(p => p.id === sid)?.name || 'Игрок');

            hostRoom.state = 'results';
            hostRoom.lastResult = {
                winner: win ? 'spy' : 'civilians',
                headline: win
                    ? (isLastChance ? '😱 Шпион украл победу!' : '⚡ Шпион угадал досрочно!')
                    : '🎉 Мирные победили!',
                subtext: isLastChance
                    ? `${spyName} в последний шанс назвал «${guessText}» — ${win ? 'И УГАДАЛ!' : 'НЕВЕРНО!'}`
                    : `${spyName} пошёл ва-банк и назвал «${guessText}» — ${win ? 'ТОЧНО В ЦЕЛЬ!' : 'ОШИБСЯ И СПАЛИЛСЯ!'}`,
                spyNames,
                card: hostRoom.card,
                spyCard: hostRoom.mode === 'undercover' ? hostRoom.spyCard : '',
                summary: hostRoom.votesSummary
            };

            win ? sfxAlert() : sfxSuccess();
            haptic(win ? 'warning' : 'success');
            syncHostToAll();
        }

        function returnOnlineToLobby() {
            if (!net.isHost || !hostRoom) return;
            hostRoom.state = 'lobby';
            hostRoom.votes = {};
            hostRoom.lastResult = null;
            hostRoom.lastChanceSpyId = null;
            syncHostToAll();
        }

        function leaveOnlineRoom() {
            if (net.isHost && hostRoom) {
                Object.values(net.clientConns).forEach(conn => {
                    try { conn.send({ type: 'closed' }); } catch {}
                });
            }
            cleanupNetwork();
            activeView = 'home';
            currentTab = 'home';
            render();
        }

        // =========================================================================
        // 8. ТАЙМЕР И РЕЖИМ «НА ОДНОМ ТЕЛЕФОНЕ»
        // =========================================================================
        function stopTimerLoop() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
        }

        function formatTime(sec) {
            const m = Math.floor(sec / 60);
            const s = sec % 60;
            return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
        }

        function ensureTimerLoop() {
            stopTimerLoop();
            const needsOnlineTimer = activeView === 'online_room' && clientView && clientView.state === 'playing' && clientView.roundEndTime > 0;
            const needsPassTimer = activeView === 'pass_play' && passGame.stage === 'discuss' && passGame.timerRunning && passGame.timerSecLeft > 0;

            if (!needsOnlineTimer && !needsPassTimer) return;

            timerInterval = setInterval(() => {
                const el = document.getElementById('live-timer-display');
                if (needsOnlineTimer && clientView) {
                    const left = Math.max(0, Math.floor((clientView.roundEndTime - Date.now()) / 1000));
                    if (el) el.textContent = formatTime(left);
                    if (left === 0) {
                        stopTimerLoop();
                        sfxAlert();
                        haptic('warning');
                        showToast('⏰ Время обсуждения вышло! Пора голосовать!', 'warn');
                    }
                } else if (needsPassTimer) {
                    passGame.timerSecLeft = Math.max(0, passGame.timerSecLeft - 1);
                    if (el) el.textContent = formatTime(passGame.timerSecLeft);
                    if (passGame.timerSecLeft === 0) {
                        passGame.timerRunning = false;
                        stopTimerLoop();
                        sfxAlert();
                        haptic('warning');
                        showToast('⏰ Время вышло! Переходите к голосованию!', 'warn');
                    }
                }
            }, 1000);
        }

        function openPassPlaySetup() {
            passGame.active = true;
            passGame.stage = 'setup';
            passGame.players = [...localPlayers];
            const packs = getAllPacks();
            passGame.packId = packs[passDefaults.packId] ? passDefaults.packId : 'cr';
            passGame.mode = passDefaults.mode || 'classic';
            passGame.spyCount = passDefaults.spyCount || 1;
            passGame.timerMin = Number.isFinite(passDefaults.timerMin) ? passDefaults.timerMin : appSettings.defaultTimer;
            activeView = 'pass_play';
            render();
        }

        function startPassPlayRound() {
            const validPlayers = passGame.players.map(s => s.trim()).filter(Boolean);
            if (validPlayers.length < 2) {
                showToast('Добавь минимум 2 игрока!', 'warn');
                return;
            }
            localPlayers = validPlayers;
            saveJson(STORAGE_KEYS.LOCAL_PLAYERS, localPlayers);
            passGame.players = validPlayers;

            const packs = getAllPacks();
            const pk = packs[passGame.packId] || DEFAULT_PACKS.cr;
            const { card, spyCard } = pickRoundWords(pk, passGame.mode);
            const idxIds = validPlayers.map((_, i) => String(i));
            const spies = pickSpies(idxIds, passGame.spyCount, '0').map(Number);

            passGame.card = card;
            passGame.spyCard = spyCard;
            passGame.spyIndices = spies;
            passGame.currentIdx = 0;
            passGame.cardRevealed = false;
            passGame.stage = 'pass';
            passGame.votedOutIdx = null;
            passGame.resultData = null;
            passGame.timerSecLeft = passGame.timerMin * 60;
            passGame.timerRunning = false;

            sfxReveal();
            haptic('medium');
            render();
        }

        // =========================================================================
        // 9. ОТРИСОВКА ЭКРАНОВ
        // =========================================================================
        function updateNavVisibility() {
            const nav = document.getElementById('bottom-nav');
            const hideNav = activeView === 'online_room' || activeView === 'pass_play';
            if (nav) nav.style.display = hideNav ? 'none' : 'block';

            document.querySelectorAll('.nav-btn').forEach(btn => {
                const isAct = btn.dataset.nav === currentTab;
                btn.style.color = isAct ? 'var(--accent)' : 'var(--text-muted)';
                btn.style.background = isAct ? 'var(--bg-input)' : 'transparent';
            });
        }

        function render() {
            const nameEl = document.getElementById('user-badge-name');
            const avEl = document.getElementById('user-badge-avatar');
            if (nameEl) nameEl.textContent = currentUser.name;
            if (avEl) avEl.textContent = currentUser.avatar || '🕵️‍♂️';
            updateNavVisibility();

            const root = document.getElementById('app-root');
            if (!root) return;

            if (activeView === 'home') root.innerHTML = renderHomeView();
            else if (activeView === 'packs') root.innerHTML = renderPacksView();
            else if (activeView === 'settings') root.innerHTML = renderSettingsView();
            else if (activeView === 'online_room') root.innerHTML = renderOnlineRoomView();
            else if (activeView === 'pass_play') root.innerHTML = renderPassPlayView();

            bindCurrentViewEvents();
            updateCheatWidget();
        }

        // --- ЭКРАН 2: ОНЛАЙН КОМНАТА ---
        function renderOnlineRoomView() {
            const v = clientView;
            if (!v) {
                return `<div class="glass-card rounded-3xl p-8 text-center mt-8">

            const modeBadge = v.mode === 'undercover'
                ? '<span class="px-2.5 py-1 rounded-full text-[11px] font-bold bg-fuchsia-500/20 text-fuchsia-300 border border-fuchsia-400/30">🎭 Под прикрытием</span>'

            if (v.state === 'lobby') {
                return `
                <div class="fade-in space-y-3.5">
                    <div class="glass-card rounded-3xl p-4">
                        <div class="flex items-start justify-between gap-2 mb-3">
                            <div>
                                <h2 class="text-lg font-black leading-tight">${escHtml(v.title)}</h2>
                                <div class="text-xs mt-1 font-medium" style="color: var(--text-muted);">${escHtml(v.packTitle)}</div>

                            <button id="btn-copy-code" class="px-3 py-1.5 rounded-xl btn-secondary font-mono font-black text-base tracking-widest flex items-center gap-1.5">

                            ${modeBadge}

                        <div class="grid grid-cols-2 gap-2">
                            <button id="btn-share-link" class="py-2.5 rounded-xl btn-secondary text-xs font-bold">🔗 Поделиться ссылкой</button>
                            ${isHost ? `<button id="btn-room-settings" class="py-2.5 rounded-xl btn-secondary text-xs font-bold">⚙️ Настройки комнаты</button>` : `<div class="py-2.5 rounded-xl text-center text-[11px] flex items-center justify-center" style="color: var(--text-muted);">Ждём старт ведущего...</div>`}
                        </div>
                    </div>

                    <div class="glass-card rounded-3xl p-4">
                        <div class="flex items-center justify-between mb-3">
                            <span class="text-xs font-bold uppercase tracking-wider" style="color: var(--text-muted);">Игроки в комнате</span>
                            <span class="text-xs font-extrabold px-2.5 py-0.5 rounded-full bg-indigo-500/20 text-indigo-300">${v.players.length} / ${v.maxPlayers}</span>
                        </div>
                        <div class="space-y-2">
                            ${v.players.map(p => `
                                <div class="flex items-center justify-between px-3.5 py-2.5 rounded-2xl" style="background: var(--bg-input);">
                                    <div class="flex items-center gap-2.5 min-w-0">
                                        <div class="w-8 h-8 rounded-full flex items-center justify-center text-base bg-indigo-500/25 shrink-0">
                                            ${escHtml(p.avatar || (p.name || 'И')[0].toUpperCase())}
                                        </div>
                                        <div class="truncate">
                                            <div class="text-sm font-bold truncate">${escHtml(p.name)} ${p.id === currentUser.id ? '<span class="text-[11px] opacity-60">(Ты)</span>' : ''}</div>
                                            ${p.username ? `<div class="text-[11px]" style="color: var(--text-muted);">${escHtml(p.username)}</div>` : ''}
                                        </div>
                                    </div>
                                    ${p.isHost ? '<span class="text-sm" title="Ведущий">👑</span>' : ''}
                                </div>
                            `).join('')}
                        </div>
                    </div>

                    <div class="space-y-2 pt-1">
                        ${isHost ? `<button id="btn-start-online" class="w-full py-4 rounded-2xl btn-primary font-extrabold text-sm">🎮 Начать раунд</button>` : ''}
                        <button id="btn-leave-online" class="w-full py-3 rounded-2xl btn-danger font-bold text-xs">
                            ${isHost ? '❌ Закрыть комнату' : '🚪 Выйти из комнаты'}
                        </button>
                    </div>
                </div>`;
            }

            if (v.state === 'playing') {
                const timeLeft = v.roundEndTime > 0 ? Math.max(0, Math.floor((v.roundEndTime - Date.now()) / 1000)) : null;

                let cardContent = '';
                let cardClass = 'hidden-glow';

                if (roleHidden) {
                    cardContent = `
                        <div class="text-4xl mb-2">🙈</div>
                        <div class="font-extrabold text-base">Роль скрыта</div>
                        <div class="text-xs mt-1" style="color: var(--text-muted);">
                            ${appSettings.holdToReveal ? 'Удерживай карточку, чтобы подсмотреть' : 'Нажми на карточку, чтобы показать роль'}
                        </div>
                    `;
                } else if (v.myRole === 'spy') {
                    cardClass = 'spy-glow';
                    cardContent = `
                        <div class="text-5xl mb-2">🕵️‍♂️</div>
                        <div class="text-xs font-bold uppercase tracking-widest text-red-300 mb-1">Твоя роль</div>
                        <div class="text-2xl font-black text-white">ТЫ — ШПИОН!</div>
                        <p class="text-xs text-red-100/85 mt-2 max-w-[260px] mx-auto leading-relaxed">
                            Ты не знаешь слово из набора <b>${escHtml(v.packTitle)}</b>. Слушай остальных, не пались и попробуй догадаться!
                        </p>
                    `;
                } else {
                    cardClass = 'civ-glow';
                    cardContent = `
                        <div class="text-4xl mb-2">${v.mode === 'undercover' ? '🎭' : '🃏'}</div>
                        <div class="text-xs font-bold uppercase tracking-widest opacity-75 mb-1">${escHtml(v.itemLabel)}</div>
                        <div class="text-2xl font-black tracking-tight px-3 py-1.5 rounded-2xl bg-black/25 inline-block">${escHtml(v.myCard)}</div>
                        <p class="text-xs opacity-80 mt-3 max-w-[270px] mx-auto leading-relaxed">
                            ${v.mode === 'undercover'
                                ? 'Режим «Под прикрытием»: у шпиона похожая, но другая карта (он сам не знает, что он шпион!).'
                                : 'Описывай аккуратно, чтобы вычислить шпиона и не подсказать ему слово!'}
                        </p>
                    `;
                }

                const voteSection = showVotePanel ? `
                    <div class="glass-card rounded-3xl p-4 fade-in">
                        <div class="flex items-center justify-between mb-3">
                            <span class="font-extrabold text-sm">🗳 Кто шпион?</span>
                            <button id="btn-close-vote" class="text-xs font-bold px-2.5 py-1 rounded-lg btn-secondary">Свернуть</button>
                        </div>
                        <div class="space-y-2">
                            ${v.players.map(p => {
                                const selected = v.myVote === p.id;
                                return `
                                <button data-vote-id="${escHtml(p.id)}" class="w-full py-3 px-4 rounded-2xl flex items-center justify-between font-bold text-sm transition ${selected ? 'btn-primary' : 'btn-secondary'}">
                                    <span>🎯 ${escHtml(p.name)}</span>
                                    <span>${selected ? '✅ Выбран' : 'Голос'}</span>
                                </button>`;
                            }).join('')}
                        </div>
                    </div>
                ` : '';

                return `
                <div class="fade-in space-y-3.5">
                    <div class="flex items-center justify-between glass-card rounded-2xl px-4 py-2.5 text-xs font-bold">
                        <span>${escHtml(v.packTitle)}</span>
                        <div class="flex items-center gap-2.5">
                            ${timeLeft !== null ? `<span class="px-2 py-0.5 rounded-lg bg-amber-500/20 text-amber-300 font-mono">⏱ <span id="live-timer-display">${formatTime(timeLeft)}</span></span>` : ''}
                            <span class="px-2 py-0.5 rounded-lg bg-indigo-500/20 text-indigo-300">🗳 ${v.votedCount}/${v.players.length}</span>
                        </div>
                    </div>

                    <div class="role-card-wrap">
                        <div id="role-card-toggle" class="role-card-inner rounded-3xl p-7 text-center cursor-pointer min-h-[225px] flex flex-col items-center justify-center ${cardClass}">
                            ${cardContent}
                        </div>
                    </div>

                    ${voteSection}

                    <div class="space-y-2">
                        <div class="grid grid-cols-2 gap-2">
                            <button id="btn-toggle-role-explicit" class="py-3 rounded-2xl btn-secondary font-bold text-xs">
                                ${roleHidden ? '👁 Показать роль' : '🙈 Скрыть роль'}
                            </button>
                            <button id="btn-open-vote" class="py-3 rounded-2xl btn-primary font-bold text-xs">
                                🗳 Голосовать ${v.myVote ? '✅' : ''}
                            </button>
                        </div>

                        ${v.myRole === 'spy' && !roleHidden ? `
                            <button id="btn-spy-early-guess" class="w-full py-3.5 rounded-2xl bg-amber-500/20 border border-amber-400/45 text-amber-300 font-extrabold text-xs active:scale-[0.98] transition">
                                💡 Назвать слово (Ва-банк шпиона)
                            </button>
                        ` : ''}

                        ${isHost ? `
                            <div class="grid grid-cols-2 gap-2 pt-1">
                                <button id="btn-host-finish" class="py-3 rounded-2xl btn-secondary font-bold text-xs">🏁 Подвести итоги</button>
                                <button id="btn-start-online" class="py-3 rounded-2xl btn-secondary font-bold text-xs">🔄 Раздать заново</button>
                            </div>
                        ` : ''}
                    </div>
                </div>`;
            }

            if (v.state === 'last_chance') {
                return `
                <div class="fade-in space-y-4">
                    <div class="rounded-3xl p-5 text-center spy-glow">
                        <div class="text-5xl mb-2">🔥</div>
                        <div class="text-xs font-extrabold uppercase tracking-widest text-amber-300 mb-1">Последний шанс</div>
                        <h2 class="text-xl font-black text-white mb-2">
                            ${v.isMyLastChance ? 'ТЕБЯ РАСКРЫЛИ!' : `Пойман: ${escHtml(v.lastChanceSpyName)}`}
                        </h2>
                        <p class="text-xs text-white/85 leading-relaxed">
                            ${v.isMyLastChance
                                ? 'У тебя есть 1 попытка! Впиши слово/карту мирных прямо сейчас — если угадаешь, ты избежишь наказания и украдёшь победу!'
                                : 'Ждём, пока шпион назовёт загаданное слово. Если он угадает — победа достанется ему!'}
                        </p>
                    </div>

                    ${v.isMyLastChance ? `
                        <div class="glass-card rounded-3xl p-4 space-y-3">
                            <input id="input-last-chance" type="text" placeholder="Введи загаданное слово..." class="w-full px-4 py-3.5 rounded-2xl field-input text-sm font-bold">
                            <button id="btn-submit-last-chance" class="w-full py-3.5 rounded-2xl btn-primary font-extrabold text-sm">🎯 Отправить догадку</button>
                        </div>
                    ` : ''}

                    ${isHost ? `
                        <button id="btn-skip-last-chance" class="w-full py-3 rounded-2xl btn-secondary font-bold text-xs">
                            ⏭ Пропустить (Шпион не угадал)
                        </button>
                    ` : ''}
                </div>`;
            }

            if (v.state === 'results' && v.lastResult) {
                const res = v.lastResult;
                const isCivWin = res.winner === 'civilians';
                return `
                <div class="fade-in space-y-4">
                    <div class="rounded-3xl p-6 text-center ${isCivWin ? 'civ-glow' : 'spy-glow'}">
                        <div class="text-5xl mb-2">${isCivWin ? '🏆' : '🕵️‍♂️'}</div>
                        <h2 class="text-2xl font-black mb-1">${escHtml(res.headline)}</h2>
                        <p class="text-xs opacity-85 leading-relaxed">${escHtml(res.subtext)}</p>
                    </div>

                    <div class="glass-card rounded-3xl p-4 space-y-2.5 text-sm">
                        <div class="flex justify-between items-center py-1.5 border-b" style="border-color: var(--border-color);">
                            <span style="color: var(--text-muted);">🕵️‍♂️ Настоящий шпион:</span>
                            <span class="font-extrabold text-red-400">${escHtml(res.spyNames.join(', '))}</span>
                        </div>
                        <div class="flex justify-between items-center py-1.5 border-b" style="border-color: var(--border-color);">
                            <span style="color: var(--text-muted);">🃏 Слово мирных:</span>
                            <span class="font-extrabold text-indigo-300">${escHtml(res.card)}</span>
                        </div>
                        ${res.spyCard ? `
                        <div class="flex justify-between items-center py-1.5 border-b" style="border-color: var(--border-color);">
                            <span style="color: var(--text-muted);">🎭 Карта шпиона:</span>
                            <span class="font-extrabold text-fuchsia-300">${escHtml(res.spyCard)}</span>
                        </div>` : ''}
                        ${res.summary && res.summary.length ? `
                            <div class="pt-1">
                                <div class="text-xs font-bold mb-1.5" style="color: var(--text-muted);">Голоса:</div>
                                ${res.summary.map(s => `<div class="text-xs flex justify-between py-0.5"><span>• ${escHtml(s.name)}</span><span class="font-bold">${s.count} гол.</span></div>`).join('')}
                            </div>
                        ` : ''}
                    </div>

                    <div class="space-y-2">
                        ${isHost ? `
                            <button id="btn-start-online" class="w-full py-4 rounded-2xl btn-primary font-extrabold text-sm">🔄 Следующий раунд</button>
                            <button id="btn-back-lobby" class="w-full py-3 rounded-2xl btn-secondary font-bold text-xs">⚙️ Вернуться в лобби и настройки</button>
                        ` : `
                            <div class="text-center text-xs py-2" style="color: var(--text-muted);">Ждём, пока ведущий запустит следующий раунд...</div>
                        `}
                        <button id="btn-leave-online" class="w-full py-3 rounded-2xl btn-danger font-bold text-xs">🚪 Выйти из комнаты</button>
                    </div>
                </div>`;
            }
            return '';
        }

        // --- ЭКРАН 3: ИГРА НА ОДНОМ ТЕЛЕФОНЕ (PASS & PLAY) ---
        function renderPassPlayView() {
            const packs = getAllPacks();
            const pk = packs[passGame.packId] || DEFAULT_PACKS.cr;

            if (passGame.stage === 'setup') {
                return `
                <div class="fade-in space-y-4">
                    <div class="flex items-center justify-between">
                        <h2 class="text-lg font-black">📱 На одном телефоне</h2>
                        <button id="pp-exit" class="px-3 py-1.5 rounded-xl btn-secondary text-xs font-bold">← Назад</button>
                    </div>

                    <div class="glass-card rounded-3xl p-4 space-y-3">
                        <div>
                            <label class="block text-xs font-bold mb-1.5" style="color: var(--text-muted);">Набор слов</label>
                            <select id="pp-pack" class="w-full px-3.5 py-2.5 rounded-2xl field-input text-sm font-semibold">
                                ${Object.values(packs).map(p => `<option value="${escHtml(p.id)}" ${passGame.packId === p.id ? 'selected' : ''}>${escHtml(p.title)} (${p.items.length})</option>`).join('')}
                            </select>
                        </div>

                        <div class="grid grid-cols-2 gap-2">
                            <button id="pp-mode-classic" class="py-2.5 rounded-xl text-xs font-bold ${passGame.mode === 'classic' ? 'btn-primary' : 'btn-secondary'}">🕵️‍♂️ Обычный</button>
                            <button id="pp-mode-under" class="py-2.5 rounded-xl text-xs font-bold ${passGame.mode === 'undercover' ? 'btn-primary' : 'btn-secondary'}">🎭 Под прикрытием</button>
                        </div>

                        <div class="grid grid-cols-2 gap-2">
                            <div>
                                <label class="block text-[11px] font-bold mb-1" style="color: var(--text-muted);">Шпионов</label>
                                <div class="grid grid-cols-2 gap-1.5">
                                    <button data-pp-spy="1" class="py-2 rounded-xl text-xs font-bold ${passGame.spyCount === 1 ? 'btn-primary' : 'btn-secondary'}">1</button>
                                    <button data-pp-spy="2" class="py-2 rounded-xl text-xs font-bold ${passGame.spyCount === 2 ? 'btn-primary' : 'btn-secondary'}">2</button>
                                </div>
                            </div>
                            <div>
                                <label class="block text-[11px] font-bold mb-1" style="color: var(--text-muted);">Таймер (мин)</label>
                                <div class="grid grid-cols-3 gap-1">
                                    ${[0, 3, 5].map(m => `<button data-pp-timer="${m}" class="py-2 rounded-xl text-xs font-bold ${passGame.timerMin === m ? 'btn-primary' : 'btn-secondary'}">${m === 0 ? '∞' : m}</button>`).join('')}
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="glass-card rounded-3xl p-4 space-y-2.5">
                        <div class="flex items-center justify-between">
                            <span class="text-xs font-bold uppercase tracking-wider" style="color: var(--text-muted);">Игроки (${passGame.players.length})</span>
                            <button id="pp-add-player" class="px-3 py-1 rounded-xl btn-secondary text-xs font-bold">➕ Добавить</button>
                        </div>
                        <div class="space-y-2">
                            ${passGame.players.map((name, idx) => `
                                <div class="flex gap-2">
                                    <input data-pp-name="${idx}" type="text" value="${escHtml(name)}" class="flex-1 px-3.5 py-2.5 rounded-xl field-input text-sm font-semibold">
                                    ${passGame.players.length > 2 ? `<button data-pp-del="${idx}" class="px-3 rounded-xl btn-danger text-xs font-bold">✕</button>` : ''}
                                </div>
                            `).join('')}
                        </div>
                    </div>

                    <button id="pp-start" class="w-full py-4 rounded-2xl btn-primary font-extrabold text-sm">🎮 Раздать роли</button>
                </div>`;
            }

            if (passGame.stage === 'pass') {
                const name = passGame.players[passGame.currentIdx];
                const isSpy = passGame.spyIndices.includes(passGame.currentIdx);

                let cardBlock = '';
                if (!passGame.cardRevealed) {
                    cardBlock = `
                        <div class="rounded-3xl p-8 text-center hidden-glow min-h-[240px] flex flex-col items-center justify-center">
                            <div class="text-4xl mb-3">🤝</div>
                            <div class="text-xs uppercase font-bold tracking-widest mb-1" style="color: var(--text-muted);">Передайте телефон</div>
                            <div class="text-2xl font-black mb-4">${escHtml(name)}</div>
                            <button id="pp-reveal-btn" class="px-6 py-3 rounded-2xl btn-primary font-extrabold text-sm">👁 Показать мою роль</button>
                        </div>`;
                } else {
                    const showSpyFace = isSpy && passGame.mode === 'classic';
                    const shownWord = isSpy ? passGame.spyCard : passGame.card;
                    cardBlock = `
                        <div class="rounded-3xl p-7 text-center min-h-[240px] flex flex-col items-center justify-center ${showSpyFace ? 'spy-glow' : 'civ-glow'}">
                            ${showSpyFace ? `
                                <div class="text-5xl mb-2">🕵️‍♂️</div>
                                <div class="text-2xl font-black text-white">ТЫ — ШПИОН!</div>
                                <p class="text-xs text-red-100/85 mt-2">Набор: <b>${escHtml(pk.title)}</b>. Постарайся угадать слово и не выдать себя!</p>
                            ` : `
                                <div class="text-4xl mb-2">${passGame.mode === 'undercover' ? '🎭' : '🃏'}</div>
                                <div class="text-xs font-bold uppercase tracking-widest opacity-80 mb-1">${escHtml(pk.itemLabel || 'Слово')}</div>
                                <div class="text-2xl font-black px-4 py-1.5 rounded-2xl bg-black/25">${escHtml(shownWord)}</div>
                                <p class="text-xs opacity-80 mt-2">${passGame.mode === 'undercover' ? 'У шпиона похожее слово — он сам не знает свою роль!' : 'Запомни и нажми «Скрыть».'}</p>
                            `}
                        </div>
                        <button id="pp-next-player" class="w-full py-4 rounded-2xl btn-primary font-extrabold text-sm mt-3">
                            ${passGame.currentIdx + 1 < passGame.players.length ? '🙈 Скрыть и передать дальше →' : '🚀 Начать обсуждение!'}
                        </button>`;
                }

                return `
                <div class="fade-in space-y-4">
                    <div class="flex items-center justify-between text-xs font-bold glass-card px-4 py-2.5 rounded-2xl">
                        <span>Раздача ролей</span>
                        <span>Игрок ${passGame.currentIdx + 1} из ${passGame.players.length}</span>
                    </div>
                    ${cardBlock}
                    <button id="pp-exit" class="w-full py-2.5 rounded-xl btn-secondary text-xs font-bold">✕ Выйти в меню</button>
                </div>`;
            }

            if (passGame.stage === 'discuss') {
                return `
                <div class="fade-in space-y-4">
                    <div class="glass-card rounded-3xl p-6 text-center space-y-3">
                        <div class="text-xs font-bold uppercase tracking-widest" style="color: var(--text-muted);">${escHtml(pk.title)}</div>
                        <div class="text-4xl font-black font-mono tracking-wider" id="live-timer-display">
                            ${passGame.timerMin > 0 ? formatTime(passGame.timerSecLeft) : '∞'}
                        </div>
                        <p class="text-xs" style="color: var(--text-muted);">
                            Задавайте друг другу вопросы по кругу и ищите шпиона!
                        </p>
                        ${passGame.timerMin > 0 ? `
                            <div class="flex justify-center gap-2 pt-1">
                                <button id="pp-timer-toggle" class="px-4 py-2 rounded-xl btn-secondary text-xs font-bold">${passGame.timerRunning ? '⏸ Пауза' : '▶️ Старт'}</button>
                                <button id="pp-timer-plus" class="px-4 py-2 rounded-xl btn-secondary text-xs font-bold">+1 мин</button>
                            </div>
                        ` : ''}
                    </div>

                    <div class="space-y-2.5">
                        <button id="pp-go-vote" class="w-full py-4 rounded-2xl btn-primary font-extrabold text-sm">🗳 Перейти к голосованию</button>
                        ${passGame.mode === 'classic' ? `
                            <button id="pp-early-guess" class="w-full py-3.5 rounded-2xl bg-amber-500/20 border border-amber-400/45 text-amber-300 font-extrabold text-xs">💡 Шпион готов назвать слово (Ва-банк)</button>
                        ` : ''}
                        <button id="pp-abort" class="w-full py-3 rounded-2xl btn-secondary font-bold text-xs">🏁 Раскрыть роли сейчас</button>
                    </div>
                </div>`;
            }

            if (passGame.stage === 'vote') {
                return `
                <div class="fade-in space-y-4">
                    <div class="flex items-center justify-between">
                        <h2 class="text-lg font-black">🗳 Кого выгоняем?</h2>
                        <button id="pp-back-discuss" class="px-3 py-1.5 rounded-xl btn-secondary text-xs font-bold">← К таймеру</button>
                    </div>
                    <p class="text-xs" style="color: var(--text-muted);">Нажми на игрока, против которого проголосовало большинство:</p>
                    <div class="space-y-2">
                        ${passGame.players.map((n, idx) => `
                            <button data-pp-kick="${idx}" class="w-full py-3.5 px-4 rounded-2xl glass-card flex items-center justify-between font-bold text-sm active:scale-[0.98] transition">
                                <span>🎯 ${escHtml(n)}</span>
                                <span class="text-xs text-red-400 font-extrabold">Выгнать →</span>
                            </button>
                        `).join('')}
                    </div>
                </div>`;
            }

            if (passGame.stage === 'last_chance') {
                const spyName = passGame.players[passGame.votedOutIdx] || 'Шпион';
                return `
                <div class="fade-in space-y-4">
                    <div class="rounded-3xl p-6 text-center spy-glow">
                        <div class="text-5xl mb-2">🔥</div>
                        <div class="text-xs font-extrabold uppercase tracking-widest text-amber-300 mb-1">Последний шанс</div>
                        <h2 class="text-xl font-black text-white mb-2">Пойман шпион: ${escHtml(spyName)}!</h2>
